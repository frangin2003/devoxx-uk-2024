<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Pelican ride</title>
<style>
  :root { --bg:#eef3f7; --fg:#23262a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10151c; --fg:#e6e8ea; } }
  body.force-light { --bg:#eef3f7; --fg:#23262a; }
  body.force-dark  { --bg:#0b1016; --fg:#e6e8ea; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:var(--bg); color:var(--fg);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { display:grid; gap:16px; justify-items:center; padding:24px; }
  .stage { width:min(86vw, 520px); }
  .stage svg { width:100%; height:auto; display:block; }
  .btns { display:flex; gap:8px; }
  button { font:inherit; font-size:13px; padding:8px 14px; border-radius:9px;
           border:1px solid #8c959e66; background:transparent; color:inherit; cursor:pointer; }
  button.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  p { margin:0; font-size:13px; opacity:.72; max-width:44ch; text-align:center; line-height:1.5; }
</style></head>
<body>
<div class="wrap">
  <div class="stage">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600"
     role="img" aria-label="A pelican in a sailor cap rides a bicycle along a coast road with the g3po robot on the back seat. Clouds drift, the sea sparkles, and a bump in the road startles them both.">
<title>Pelican and g3po by the sea</title>
<defs>
  <clipPath id="frame"><rect x="0" y="0" width="600" height="600" rx="44" ry="44"/></clipPath>
  <clipPath id="seaclip"><rect x="0" y="250" width="600" height="140"/></clipPath>
  <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" class="sea-a"/><stop offset="1" class="sea-b"/>
  </linearGradient>
  <radialGradient id="sunGlow">
    <stop offset="0" stop-color="#ffd34d" stop-opacity=".55"/>
    <stop offset="55%" stop-color="#ffcf3f" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#ffcf3f" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="moonGlow">
    <stop offset="0" stop-color="#dfe8ff" stop-opacity=".5"/>
    <stop offset="60%" stop-color="#cfe0ff" stop-opacity=".14"/>
    <stop offset="100%" stop-color="#cfe0ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" class="road-a"/><stop offset="1" class="road-b"/>
  </linearGradient>
</defs>

<style>
  svg { --sea-a:#4a9ad8; --sea-b:#20609e; --foam:#eaf4ff; --sand:#e9d9ae;
        --road-a:#7a838d; --road-b:#5b636c; --line:#f2f2ef; --verge:#7fae5c;
        --rock:#8c959e; --shadow:rgba(20,24,30,.18); }
  .sea-a { stop-color:var(--sea-a); } .sea-b { stop-color:var(--sea-b); }
  .road-a { stop-color:var(--road-a); } .road-b { stop-color:var(--road-b); }

  .night-only { opacity:0; }
  .day-only   { opacity:1; }

  @media (prefers-color-scheme: dark) {
    svg { --sea-a:#1d4a76; --sea-b:#0d2740; --foam:#9dc4e8; --sand:#8a7c5c;
          --road-a:#454b53; --road-b:#2f343a; --line:#c9ccd0; --verge:#3d5c37;
          --rock:#5b636c; --shadow:rgba(0,0,0,.32); }
    .night-only { opacity:1; }
    .day-only   { opacity:0; }
  }
  /* manual override for sites that switch themes themselves */
  svg.night { --sea-a:#1d4a76; --sea-b:#0d2740; --foam:#9dc4e8; --sand:#8a7c5c;
        --road-a:#454b53; --road-b:#2f343a; --line:#c9ccd0; --verge:#3d5c37;
        --rock:#5b636c; --shadow:rgba(0,0,0,.32); }
  svg.night .night-only { opacity:1; }
  svg.night .day-only { opacity:0; }
  svg.day .night-only { opacity:0; }
  svg.day .day-only { opacity:1; }

  /* ---- scrollers: each travels exactly one tile per cycle ---- */
  .scroll-cloud { animation: sc600 10s linear infinite; }
  .scroll-sea   { animation: sc200 2s  linear infinite; }
  .scroll-road  { animation: sc80  0.5s linear infinite; }
  .scroll-verge { animation: sc240 1s  linear infinite; }
  .scroll-bump  { animation: bump1600 10s linear infinite; }
  @keyframes sc600 { to { transform: translateX(-600px); } }
  @keyframes sc200 { to { transform: translateX(-200px); } }
  @keyframes sc80  { to { transform: translateX(-80px);  } }
  @keyframes sc240 { to { transform: translateX(-240px); } }
  @keyframes bump1600 { to { transform: translateX(-1600px); } }

  /* ---- sky ---- */
  .sun { fill:#ffcc33; }
  .rays { stroke:#ffd34d; stroke-width:5; stroke-linecap:round;
           transform-origin:470px 96px; animation: turn30 10s linear infinite; }
  @keyframes turn30 { to { transform: rotate(30deg); } }   /* 12 rays: seamless */
  .sunpulse { transform-origin:470px 96px; animation: breathe 5s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform:scale(1); opacity:.95 }
                        50% { transform:scale(1.06); opacity:1 } }
  .moon { fill:#f2f1e6; }
  .crater { fill:#d9d8cb; }
  .star { fill:#fdfbf2; animation-name: twinkle; animation-iteration-count:infinite;
           animation-timing-function: ease-in-out; }
  .starbig circle { fill:#ffffff; }
  .starbig path { stroke:#ffffff; stroke-width:.9; stroke-linecap:round; opacity:.75; }
  .starbig { animation-name: twinkle; animation-iteration-count:infinite;
              animation-timing-function: ease-in-out; }
  @keyframes twinkle { 0%,100% { opacity:.25 } 50% { opacity:1 } }
  .starfield { animation: drift 10s ease-in-out infinite; }
  @keyframes drift { 0%,100% { transform:translateX(0) } 50% { transform:translateX(-14px) } }
  .cloud { fill:#ffffff; }

  /* ---- sea ---- */
  .waves path { fill:none; stroke:var(--foam); stroke-width:2.6; stroke-linecap:round; }
  .glitter { fill:#ffe9a8; animation: shimmer 2.5s ease-in-out infinite; }
  .glitter2 { animation-delay:-1.25s; }
  @keyframes shimmer { 0%,100% { opacity:.25 } 50% { opacity:.8 } }
  .foamline { fill:none; stroke:var(--foam); stroke-width:3; stroke-linecap:round; opacity:.5; }
  .sail { fill:#fbfbf7; } .sail2 { fill:#e4e3da; } .hull { fill:#3a3f45; }

  /* ---- road ---- */
  .road { fill:url(#roadGrad); }
  .line { fill:var(--line); opacity:.85; }
  .kerb { fill:var(--sand); }
  .verge { fill:var(--verge); }
  .tuft { fill:var(--verge); }
  .rock { fill:var(--rock); }
  .bump { fill:var(--road-a); stroke:var(--road-b); stroke-width:2; }
  .bumptop { fill:none; stroke:var(--line); stroke-width:2.4; stroke-linecap:round; opacity:.5; }

  /* ---- the rig: two jolts, timed to the bump reaching each wheel ---- */
  .rig { animation: jolt 10s linear infinite; }
  @keyframes jolt {
    0%,50%   { transform: translateY(0) rotate(0deg); }
    52%      { transform: translateY(-9px) rotate(-1.6deg); }
    54.5%    { transform: translateY(2px) rotate(.6deg); }
    56.5%    { transform: translateY(0) rotate(0deg); }
    59.5%    { transform: translateY(-7px) rotate(1.4deg); }
    61.5%    { transform: translateY(1.5px) rotate(-.5deg); }
    63.5%,100% { transform: translateY(0) rotate(0deg); }
  }
  .rig { transform-origin:300px 500px; }
  .bob { animation: bob 2.5s ease-in-out infinite; transform-origin:300px 460px; }
  @keyframes bob { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-2.5px) } }
  .robot { animation: jolt2 10s linear infinite; transform-origin:239px 440px; }
  @keyframes jolt2 {
    0%,50.5% { transform: translateY(0) rotate(0deg); }
    52.5%    { transform: translateY(-13px) rotate(-3deg); }
    55%      { transform: translateY(3px) rotate(1.4deg); }
    57%      { transform: translateY(-2px) rotate(-.6deg); }
    58.5%    { transform: translateY(0) rotate(0deg); }
    60%      { transform: translateY(-9px) rotate(2.2deg); }
    62.5%    { transform: translateY(2px) rotate(-.8deg); }
    64.5%,100% { transform: translateY(0) rotate(0deg); }
  }
  .spin { animation: roll 1.25s linear infinite; }   /* 8 turns per loop */
  @keyframes roll { to { transform: rotate(360deg); } }
  .crank { animation: roll 2.5s linear infinite; transform-origin:300px 486px; }
  .legbob { animation: legbob 2.5s ease-in-out infinite; transform-origin:300px 420px; }
  @keyframes legbob { 0%,100% { transform:translateY(0) } 50% { transform:translateY(3px) } }

  /* ---- faces: startled through the bump, smiling the rest of the time ---- */
  .calm     { animation: calm 10s steps(1,end) infinite; }
  .startled { animation: startled 10s steps(1,end) infinite; }
  @keyframes calm     { 0%,50.5% { opacity:1 } 51% { opacity:0 }
                         66% { opacity:0 } 66.5%,100% { opacity:1 } }
  @keyframes startled { 0%,50.5% { opacity:0 } 51% { opacity:1 }
                         66% { opacity:1 } 66.5%,100% { opacity:0 } }

  .tyre { fill:none; stroke:#2b2f34; stroke-width:6; }
  .spoke { stroke:#c9ccd0; stroke-width:1.6; }
  .hub { fill:#c9ccd0; }
  .frame { fill:none; stroke:#c0392b; stroke-width:6; stroke-linecap:round; }
  .frame2 { fill:none; stroke:#9c2f22; stroke-width:5; stroke-linecap:round; }
  .rack { fill:#8c959e; }
  .pel { fill:#f7f6f1; }
  .pel-sh { fill:#e2e0d6; }
  .bill { fill:#f2a03c; }
  .pouch { fill:#f8bd63; }
  .leg { stroke:#f2a03c; stroke-width:7; stroke-linecap:round; fill:none; }
  .cap { fill:#2f6fb5; }
  .capband { fill:#f7f6f1; }
  .ink { fill:none; stroke:#23262a; stroke-width:3.2; stroke-linecap:round; }
  .pupil { fill:#23262a; }
  .eyewhite { fill:#ffffff; }
  .bot { fill:#f2c11c; }
  .bot-d { fill:#e0ac12; }
  .blush { fill:#ef8f68; opacity:.85; }
  .panel { fill:#c9ccd0; }
  .sq1 { fill:#2f6fb5; } .sq2 { fill:#c0392b; }
  .antenna { stroke:#b9bcc0; stroke-width:3; stroke-linecap:round; }
  .antenna-tip { fill:#c0392b; animation: blink 2.5s steps(1,end) infinite; }
  @keyframes blink { 0%,60% { opacity:1 } 61%,100% { opacity:.3 } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .startled { opacity:0; }
  }
</style>

<script>
  var svg = document.querySelector(".stage svg");
  var btns = { bLight:["force-light","day"], bDark:["force-dark","night"], bSys:["",""] };
  Object.keys(btns).forEach(function (id) {
    document.getElementById(id).onclick = function () {
      document.body.className = btns[id][0];
      svg.setAttribute("class", btns[id][1]);
      Object.keys(btns).forEach(function (o) {
        document.getElementById(o).classList.toggle("on", o === id); });
    };
  });
</script>
