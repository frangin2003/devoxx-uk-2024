      <path d="M326,226 L331,192" stroke="#ef8f68" stroke-width="3" stroke-linecap="round"/>
      <g class="bt-garnish" style="animation-delay:4s"><g transform="translate(330,196) rotate(18)"><rect x="-5" y="0" width="10" height="9" rx="2" fill="#4d5660"/><rect x="-3.5" y="-5" width="2" height="5" fill="#b9bcc0"/><rect x="1.5" y="-5" width="2" height="5" fill="#b9bcc0"/></g></g>
      <path d="M307,208 L337,208 L334,238 L310,238 Z" fill="none" stroke="#c9ccd0" stroke-width="2.5" stroke-linejoin="round"/>
