<svg width="760" height="680" xmlns="http://www.w3.org/2000/svg" data-name="yellow-robot-bartender" viewBox="0 0 380 340" role="img" aria-label="Yellow robot bartender shakes a cocktail and serves drinks labelled skills, agents and MCP down the bar.">
<style>
  :root, svg { color-scheme: only light; }
  /* G3: everything repeats every 2 s */
  .bt-body  { transform-box: view-box; transform-origin: 190px 266px; animation: btSway 2s infinite ease-in-out; }
  .bt-head  { transform-box: view-box; transform-origin: 190px 190px; animation: btHead 2s infinite ease-in-out; }
  .bt-arm   { transform-box: view-box; transform-origin: 260px 206px; animation: btArm 2s infinite; }
  .bt-shk   { transform-box: view-box; transform-origin: 260px 254px; animation: btShk 2s infinite; }
  .bt-armL  { transform-box: view-box; transform-origin: 120px 206px; animation: btArmL 2s infinite ease-in-out; }
  .bt-happy { animation: btHappy 2s infinite steps(1); }
  .bt-focus { animation: btFocus 2s infinite steps(1); }
  .bt-lamp  { animation: btLamp 1s infinite steps(1); }
  .bt-stream { animation: btStream 6s infinite steps(1) both; }
  .bt-drip  { transform-box: view-box; animation: btDrip .25s infinite linear; }
  .bt-shake { animation: btShakeLines 2s infinite steps(1); }
  /* drinks: a 6 s cycle each, offset by 0 / 2 / 4 s */
  .bt-glass { transform-box: view-box; animation: btSlide 6s infinite both; }
  .bt-pop   { transform-box: view-box; transform-origin: 322px 238px; animation: btPop 6s infinite both; }
  .bt-fill  { transform-box: view-box; transform-origin: 322px 238px; animation: btFill 6s infinite both; }
  .bt-tag   { transform-box: view-box; transform-origin: 322px 186px; animation: btTag 6s infinite both; }
  .bt-garnish { animation: btGarnish 6s infinite both; }
  .bt-bob   { transform-box: view-box; animation: btFloat 1s infinite ease-in-out; }
  .bt-star  { transform-box: fill-box; transform-origin: center; animation: btStar 2s infinite both; }

  @keyframes btSway { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
  @keyframes btHead {
    0%,40% { transform: translateY(0) rotate(-2deg); }
    5%,15%,25%,35% { transform: translateY(4px) rotate(2deg); }
    10%,20%,30% { transform: translateY(0) rotate(-2deg); }
    50%,64% { transform: translateY(3px) rotate(6deg); }
    76% { transform: translateY(-3px) rotate(-3deg); }
    86% { transform: translateY(2px) rotate(0deg); }
  }
  /* raised and shaking, then the pour, then back up */
  @keyframes btArm {
    0%   { transform: rotate(-165deg); animation-timing-function: ease-in-out; }
    5%   { transform: rotate(-150deg) translateY(-4px); }
    10%  { transform: rotate(-172deg); }
    15%  { transform: rotate(-150deg) translateY(-4px); }
    20%  { transform: rotate(-172deg); }
    25%  { transform: rotate(-150deg) translateY(-4px); }
    30%  { transform: rotate(-172deg); }
    35%  { transform: rotate(-150deg) translateY(-4px); }
    41%  { transform: rotate(-165deg); animation-timing-function: cubic-bezier(.3,1.4,.5,1); }
    50%  { transform: rotate(-150deg); }
    66%  { transform: rotate(-150deg); animation-timing-function: cubic-bezier(.3,1.5,.5,1); }
    76%  { transform: rotate(-168deg); }
    86%,100% { transform: rotate(-165deg); }
  }
  @keyframes btShk {
    0%,41% { transform: rotate(0deg); }
    50% { transform: rotate(100deg); animation-timing-function: ease-in-out; }
    58% { transform: rotate(106deg); }
    66% { transform: rotate(100deg); animation-timing-function: cubic-bezier(.3,1.5,.5,1); }
    76%,100% { transform: rotate(0deg); }
  }
  @keyframes btArmL { 0%,100% { transform: rotate(-12deg); } 72% { transform: rotate(-12deg); } 80% { transform: rotate(-58deg); } 92% { transform: rotate(-20deg); } }
  @keyframes btHappy { 0% { opacity: 1; } 44% { opacity: 0; } 68% { opacity: 1; } }
  @keyframes btFocus { 0% { opacity: 0; } 44% { opacity: 1; } 68% { opacity: 0; } }
  @keyframes btStream { 0% { opacity: 0; } 17% { opacity: 1; } 21.7%,100% { opacity: 0; } }
  @keyframes btShakeLines { 0% { opacity: 1; } 40% { opacity: 0; } }
  @keyframes btDrip { from { transform: translateY(0); } to { transform: translateY(10px); } }
  @keyframes btLamp { 0% { opacity: 1; } 50% { opacity: .3; } }
  @keyframes btFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

  /* one glass: appears empty, fills during the pour, gets its tag, slides away */
  @keyframes btPop {
    0% { transform: scale(0); } 3% { transform: scale(1.12); } 5%,100% { transform: scale(1); }
  }
  @keyframes btFill {
    0%,16.7% { transform: scaleY(0); } 21.7%,100% { transform: scaleY(1); }
  }
  @keyframes btGarnish { 0%,21% { opacity: 0; } 22%,100% { opacity: 1; } }
  @keyframes btTag {
    0%,22% { transform: scale(0); } 23.6% { transform: scale(1.18); } 24.8%,100% { transform: scale(1); }
  }
  @keyframes btSlide {
    0% { opacity: 1; transform: translateX(0) rotate(0); }
    25% { transform: translateX(0) rotate(0); animation-timing-function: cubic-bezier(.55,0,.8,.4); }
    33.2% { opacity: 1; transform: translateX(118px) rotate(4deg); }
    33.3%,100% { opacity: 0; transform: translateX(118px); }
  }
  @keyframes btStar {
    0%,70% { opacity: 0; transform: scale(.2); } 75% { opacity: 1; transform: scale(1.2); } 86%,100% { opacity: 0; transform: scale(.6); }
  }
</style>
<rect x="0" y="0" width="380" height="340" fill="#f7f7f5"/>

<!-- back wall: a shelf of bottles -->
<rect x="292" y="150" width="82" height="6" rx="3" fill="#b9bcc0"/>
<rect x="304" y="104" width="8" height="14" rx="2" fill="#2f6fb5"/><rect x="303" y="100" width="10" height="5" rx="2" fill="#23262a"/><rect x="298" y="116" width="20" height="34" rx="6" fill="#2f6fb5"/><rect x="301" y="126" width="14" height="10" rx="2" fill="#f7f7f5" opacity=".75"/><rect x="328" y="94" width="8" height="14" rx="2" fill="#8fbf6a"/><rect x="327" y="90" width="10" height="5" rx="2" fill="#c0392b"/><rect x="322" y="106" width="20" height="44" rx="6" fill="#8fbf6a"/><rect x="325" y="116" width="14" height="10" rx="2" fill="#f7f7f5" opacity=".75"/><rect x="352" y="108" width="8" height="14" rx="2" fill="#ef8f68"/><rect x="351" y="104" width="10" height="5" rx="2" fill="#23262a"/><rect x="346" y="120" width="20" height="30" rx="6" fill="#ef8f68"/><rect x="349" y="130" width="14" height="10" rx="2" fill="#f7f7f5" opacity=".75"/>

<!-- G3 -->
<g class="bt-body">
  <g class="bt-armL"><rect x="104" y="198" width="32" height="58" rx="16" fill="#e0ac12"/></g>
  <rect x="178" y="178" width="24" height="24" rx="9" fill="#e0ac12"/>
  <rect x="138" y="192" width="104" height="86" rx="22" fill="#f2c11c"/>
  <rect x="162" y="216" width="56" height="34" rx="7" fill="#c9ccd0"/>
  <rect x="170" y="224" width="16" height="18" rx="3" fill="#2f6fb5"/>
  <rect x="194" y="224" width="16" height="18" rx="3" fill="#c0392b"/>
  <!-- bow tie -->
  <path d="M190 197 L172 187 Q168 197 172 207 Z M190 197 L208 187 Q212 197 208 207 Z" fill="#23262a"/>
  <circle cx="190" cy="197" r="5" fill="#23262a"/>
  <g class="bt-head">
    <rect x="186" y="22" width="8" height="34" rx="4" fill="#b9bcc0"/>
    <circle class="bt-lamp" cx="190" cy="16" r="9" fill="#c0392b"/>
    <rect x="92" y="52" width="196" height="134" rx="64" fill="#f2c11c"/>
    <circle cx="122" cy="146" r="12" fill="#ef8f68" opacity="0.5"/>
    <circle cx="258" cy="146" r="12" fill="#ef8f68" opacity="0.5"/>
    <g class="bt-happy" fill="none" stroke="#23262a" stroke-width="9" stroke-linecap="round">
      <path d="M134 124 Q156 98 178 124"/>
      <path d="M202 124 Q224 98 246 124"/>
    </g>
    <g class="bt-focus">
      <circle cx="160" cy="120" r="21" fill="#23262a"/><circle cx="228" cy="120" r="21" fill="#23262a"/>
      <circle cx="166" cy="114" r="7" fill="#fff"/><circle cx="234" cy="114" r="7" fill="#fff"/>
      <circle cx="171" cy="127" r="3" fill="#c9ccd0"/><circle cx="239" cy="127" r="3" fill="#c9ccd0"/>
    </g>
  </g>
</g>

<!-- the bar -->
<rect x="20" y="238" width="340" height="70" rx="10" fill="#3a3f45"/>
<rect x="20" y="238" width="340" height="10" rx="5" fill="#5b636c"/>
<rect x="20" y="262" width="340" height="5" fill="#f2c11c"/>

<!-- drinks (on the bar, behind the pouring arm) -->
<g font-family="system-ui, -apple-system, sans-serif">
  <clipPath id="bt-cup0"><path d="M307,208 L337,208 L334,238 L310,238 Z"/></clipPath>
  <g class="bt-glass" style="animation-delay:0s">
    <g class="bt-stream" style="animation-delay:0s">
      <path d="M322.3,197.6 L322,232" stroke="#f2c11c" stroke-width="4.5" stroke-linecap="round"/>
      <circle class="bt-drip" cx="324" cy="202.6" r="2.2" fill="#f2c11c"/>
    </g>
    <g class="bt-pop" style="animation-delay:0s">
      <path d="M307,208 L337,208 L334,238 L310,238 Z" fill="#ffffff" opacity=".55"/>
      <g clip-path="url(#bt-cup0)">
        <g class="bt-fill" style="animation-delay:0s">
          <rect x="306" y="212" width="32" height="30" fill="#f2c11c"/>
          <rect x="306" y="212" width="32" height="3" fill="#ffffff" opacity=".35"/>
          <circle cx="316" cy="229" r="1.6" fill="#fff" opacity=".7"/>
          <circle cx="327" cy="223" r="1.2" fill="#fff" opacity=".7"/>
