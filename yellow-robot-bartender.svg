      <path d="M326,226 L331,192" stroke="#ef8f68" stroke-width="3" stroke-linecap="round"/>
      <g class="bt-garnish" style="animation-delay:0s"><circle cx="333" cy="207" r="7" fill="#f7f1d0" stroke="#f2c11c" stroke-width="2.5"/><path d="M333,201 V213 M327,207 H339" stroke="#f2c11c" stroke-width="1.4"/></g>
      <path d="M307,208 L337,208 L334,238 L310,238 Z" fill="none" stroke="#c9ccd0" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M311,212 L313,234" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
    </g>
    <g class="bt-tag" style="animation-delay:0s">
      <rect x="295.4" y="166" width="53.2" height="20" rx="10" fill="#23262a"/>
      <text x="322" y="180" text-anchor="middle" font-size="11" font-weight="800" fill="#f2c11c"
            letter-spacing=".06em">SKILLS</text>
    </g>
  </g>
  <clipPath id="bt-cup1"><path d="M307,208 L337,208 L334,238 L310,238 Z"/></clipPath>
  <g class="bt-glass" style="animation-delay:2s">
    <g class="bt-stream" style="animation-delay:2s">
      <path d="M322.3,197.6 L322,232" stroke="#2f6fb5" stroke-width="4.5" stroke-linecap="round"/>
      <circle class="bt-drip" cx="324" cy="202.6" r="2.2" fill="#2f6fb5"/>
    </g>
    <g class="bt-pop" style="animation-delay:2s">
      <path d="M307,208 L337,208 L334,238 L310,238 Z" fill="#ffffff" opacity=".55"/>
      <g clip-path="url(#bt-cup1)">
        <g class="bt-fill" style="animation-delay:2s">
          <rect x="306" y="212" width="32" height="30" fill="#2f6fb5"/>
          <rect x="306" y="212" width="32" height="3" fill="#ffffff" opacity=".35"/>
          <circle cx="316" cy="229" r="1.6" fill="#fff" opacity=".7"/>
          <circle cx="327" cy="223" r="1.2" fill="#fff" opacity=".7"/>
        </g>
      </g>
      <path d="M326,226 L331,192" stroke="#ef8f68" stroke-width="3" stroke-linecap="round"/>
      <g class="bt-garnish" style="animation-delay:2s"><g class="bt-bob"><rect x="313" y="210" width="18" height="12" rx="6" fill="#f2c11c"/><circle cx="318" cy="216" r="2" fill="#23262a"/><circle cx="326" cy="216" r="2" fill="#23262a"/></g></g>
      <path d="M307,208 L337,208 L334,238 L310,238 Z" fill="none" stroke="#c9ccd0" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M311,212 L313,234" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
    </g>
    <g class="bt-tag" style="animation-delay:2s">
      <rect x="295.4" y="166" width="53.2" height="20" rx="10" fill="#23262a"/>
      <text x="322" y="180" text-anchor="middle" font-size="11" font-weight="800" fill="#f2c11c"
            letter-spacing=".06em">AGENTS</text>
    </g>
  </g>
  <clipPath id="bt-cup2"><path d="M307,208 L337,208 L334,238 L310,238 Z"/></clipPath>
  <g class="bt-glass" style="animation-delay:4s">
    <g class="bt-stream" style="animation-delay:4s">
      <path d="M322.3,197.6 L322,232" stroke="#c0392b" stroke-width="4.5" stroke-linecap="round"/>
      <circle class="bt-drip" cx="324" cy="202.6" r="2.2" fill="#c0392b"/>
