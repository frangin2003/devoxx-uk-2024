          lookY: d > 900 ? -1 : 0, lookX: d > 1300 ? .6 : 0,
          blink: G3M.g3Life.blink(t, hitT + 1100),
          antenna: pinned ? 70 : G3M.g3Life.twang(t, hitT + 560, 34),
          lift: d > 560 && d < 760 ? Math.sin((d - 560) / 200 * Math.PI) * 60 : 0 });
      }
    };
  };

  // ------------------------------------------------------------ BigTextSequence
  S.sequence = function (el, cfg) {
    el.style.background = G3M.color(cfg.background || "white");
    const wrap = layer(el, 1);
    const ls = lines(cfg.text || "SHIP.|FASTER.");
    const bt = G3M.BigText(wrap, { text: ls, width: cfg.width ?? .8, color: cfg.foreground || "ink",
      stretch: cfg.stretch ?? 72, leading: .82 });
    const beat = cfg.beat ?? 420;
    return {
      duration: cfg.duration ?? (ls.length * beat + 1500),
      render(t) {
        G3M.animateText(bt, t, { entrance: cfg.entrance || "pop", stagger: beat, rotate: cfg.rotate ?? -2,
          exit: cfg.exit, exitAt: cfg.exitAt ?? (cfg.exit ? (cfg.duration ?? ls.length * beat + 1500) - 460 : Infinity) });
        // a tiny camera punch on every word
        let k = 0;
        for (let i = 0; i < ls.length; i++) k += kf(t - i * beat, [[0, 0], [60, .02, E.outQuad], [260, 0, E.outQuad]]);
        wrap.style.transform = `scale(${1 + k})`;
      }
    };
  };

  // ------------------------------------------------------------ SplitTypography
  /* The word is printed on yellow columns, one per letter. The columns part
   * to show the footage behind, then fly off. */
  S.split = function (el, cfg) {
    el.style.background = C.ink;
    const media = G3M.Media(layer(el, 1), { src: cfg.src || "mock", treatment: "fullscreen", kind: cfg.kind });
    const front = layer(el, 2);
    const word = String(cfg.text || "SPLIT").toUpperCase();
    const n = word.length, colW = 1920 / n;
    // each letter must fit inside its own column, so size by the widest glyph
    const st = { fontStretch: (cfg.stretch ?? 70) + "%" };
    const widest = Math.max(1, ...word.split("").map(ch => G3M.measureText(ch, st)));
    const size = Math.min(100 * colW * .86 / widest, 1080 * .62);
    const cols = [];
    for (let i = 0; i < n; i++) {
      const c = h("div", {}, front);
      css(c, { position: "absolute", left: (i * colW - 1) + "px", top: "0", width: (colW + 2) + "px", height: "1080px",
        background: G3M.color(cfg.background || "yellow"), overflow: "visible", willChange: "transform" });
      const l = h("div", { text: word[i] }, c);
      css(l, { position: "absolute", left: "50%", top: "50%", transform: "translate(-50%,-54%)",
        fontFamily: G3M.FONT, fontWeight: 900, fontStretch: (cfg.stretch ?? 70) + "%", fontSize: size + "px",
        lineHeight: ".8", color: G3M.color(cfg.foreground || "ink") });
      cols.push({ c, l });
    }
    return {
      duration: cfg.duration ?? 2300,
      render(t) {
        media.camera({ zoom: kf(t, [[500, 1.18], [1500, 1, E.outCubic]]), fx: .5, fy: .5,
          mediaTime: t / 1000, blur: kf(t, [[400, .5], [1100, 0, E.outCubic]]) });
        cols.forEach(({ c, l }, i) => {
          const pop = G3M.textIn.pop(t - i * 45);
          l.style.transform = `translate(-50%,-54%) scale(${pop.sx},${pop.sy})`;
          l.style.opacity = pop.op;
          const mid = (n - 1) / 2, off = i - mid;
          const spread = kf(t, [[650, 0], [1050, 1, E.outBack(1.6)]]);
          const gapX = off * spread * 150;
          const fly = clamp((t - 1350 - Math.abs(off) * 40) / 480);
          const dirY = i % 2 ? 1 : -1;
          const fy = E.inBack(1.5)(fly) * 1250 * dirY;
          const rot = E.inQuad(fly) * 22 * dirY * (off < 0 ? -1 : 1);
          c.style.transform = `translate(${gapX}px,${fy}px) rotate(${rot}deg)`;
        });
      }
    };
  };

})(window.G3M = window.G3M || {});

</script>
<script>/* scenes/media.js */
/* Scene templates built around footage. */
(function (G3M) {
  "use strict";
  const { h, css, s, set, C, kf, ease: E, clamp } = G3M;
  const S = G3M.scenes;
  const layer = G3M.sceneLayer;

  /* A camera track: a list of moves, each easing from wherever the previous
   * move left the camera. Deterministic for any t. */
  G3M.CameraTrack = function (initial = {}) {
    const base = { zoom: 1, fx: .5, fy: .5, dim: 0, blur: 0, panX: 0, panY: 0, ...initial };
    const moves = [];
    return {
      moves,
      to(at, dur, target, ease = "inOutCubic") { moves.push({ at, dur, target, ease: G3M.easing(ease) }); return this; },
      at(t) {
        let cur = { ...base };
        for (const m of moves.slice().sort((a, b) => a.at - b.at)) {
          if (t < m.at) break;
          const p = m.ease(clamp((t - m.at) / (m.dur || 1)));
          const next = { ...cur };
          for (const k in m.target) {
            if (k === "spot") { next.spot = p > 0 ? m.target.spot : cur.spot; continue; }
            next[k] = G3M.lerp(cur[k] ?? 0, m.target[k], p);
          }
          cur = next;
        }
        return cur;
      }
    };
  };

  // ------------------------------------------------------------ VideoReveal
  S.video = function (el, cfg) {
    el.style.background = G3M.color(cfg.background || "white");
    const media = G3M.Media(layer(el, 1), { src: cfg.src || "mock", treatment: cfg.treatment || "browser", kind: cfg.kind });
    const cam = G3M.CameraTrack();
    let runAt = cfg.runAt ?? null;
    const f = media.frame;
    const entrance = cfg.entrance || "pop";
    const api = {
      duration: cfg.duration ?? 700,
      media, cam,
      click(t) { if (runAt == null && media.mock) runAt = t; },
      zoom(t, o) {
        cam.to(t, o.duration ?? 900, { zoom: o.scale ?? 1, fx: o.x ?? .5, fy: o.y ?? .5,
          ...(o.dim != null ? { dim: o.dim } : {}), ...(o.blur != null ? { blur: o.blur } : {}) }, o.ease || "inOutCubic");
      },
      spotlight(t, o) { cam.to(t, 1, { spot: o ? { x: o.x, y: o.y, r: o.r ?? .16 } : null }); },
      render(t) {
        let sc = 1, rot = f.rot || 0, y = 0;
        if (entrance === "pop") {
          sc = kf(t, [[0, .55], [360, 1.04, E.outCubic], [520, .99], [640, 1, E.outQuad]]);
          rot += kf(t, [[0, -6], [520, 0, E.pop]]);
        } else if (entrance === "rise") {
          y = kf(t, [[0, 1100], [520, -24, E.outQuint], [700, 0, E.outQuad]]);
        }
        media.el.style.transform = `translateY(${y}px) rotate(${rot}deg) scale(${sc})`;
        media.el.style.opacity = t > 0 || entrance === "none" ? 1 : 0;
        const c = cam.at(t);
        media.camera({ ...c, mediaTime: t / 1000 });
        if (media.mock) media.mock.update(t, runAt);
      }
    };
    return api;
  };

  // ------------------------------------------------------------ CursorDemo
  /* A giant cursor heads for the Run button. G3 is standing in its path,
   * notices, and dives out of the way. The click lands, the agents start, the
   * camera punches in, and G3 peeks back to approve. */
  S.cursorDemo = function (el, cfg) {
    el.style.background = G3M.color(cfg.background || "yellow");
    const v = S.video(layer(el, 1), { ...cfg, treatment: cfg.treatment || "browser", background: "transparent" });
    const top = layer(el, 3);
    const svg = G3M.svgLayer(top, 1920, 1080);
    const g3 = G3M.G3(svg);
    const cur = G3M.Cursor(svg, { x: 2100, y: 1250, scale: 1.25 });
    const run = v.media.point(.905, .086);
    const g3X = 1180, g3Y = 1010;
    cur.move(1400, 820, { at: 500, dur: 650, bend: .1 })          // heads straight at G3
       .wait(260)
       .move(run[0], run[1] + 10, { dur: 520, bend: -.25 })
       .click({ hold: 400 });
    const clickAt = 500 + 650 + 260 + 520;
    v.zoom(clickAt + 500, { x: .55, y: .42, scale: 1.7, duration: 900 });
    v.zoom(clickAt + 2300, { x: .5, y: .5, scale: 1, duration: 650 });
    return {
      duration: cfg.duration ?? 4700,
      render(t) {
        if (t >= clickAt) v.click(clickAt);
        v.render(t);
        cur.render(t);
        // G3: idles, sees the cursor coming, leaps aside, later peeks back in
        const notice = 780, leap = 1050, back = clickAt + 1500;
        const leapP = clamp((t - leap) / 380);
        let x = g3X + E.outCubic(leapP) * 520;
        const lift = leapP > 0 && leapP < 1 ? Math.sin(leapP * Math.PI) * 220 : 0;
        const landD = t - (leap + 380);
        let squash = landD >= 0 ? kf(landD, [[0, .25], [120, -.06, E.outQuad], [260, 0, E.outQuad]]) : 0;
        if (t > notice && t < leap) squash = kf(t - notice, [[0, 0], [200, .16, E.outQuad]]);   // crouch
        const y = g3Y + (t > back ? E.inBack(1.4)(clamp((t - back - 900) / 350)) * 400 : 0);
        g3.set({ x, y, scale: 1.05, lift, squash,
          eyes: t > notice && t < leap + 380 ? "wide" : t > back + 200 ? "happy" : "round",
          lookX: t < notice ? 0 : t < back ? -1 : -.6, lookY: t > notice && t < leap ? .5 : 0,
          rot: leapP > 0 && leapP < 1 ? 16 : 0,
          armL: t > back + 250 ? kf(t - back - 250, [[0, 20], [200, 150, E.pop]]) : 0,
          antenna: G3M.g3Life.twang(t, leap + 380, 26),
          blink: G3M.g3Life.blink(t, back + 80), opacity: 1 });
      }
    };
  };

  // ------------------------------------------------------------ TypingDemo
  /* cfg.script: [["type","Fix this issue"],["pause",400],["delete","issue"],
   *              ["type","entire bloody thing"],["pause",300],["submit"]] */
  S.typing = function (el, cfg) {
    el.style.background = G3M.color(cfg.background || "yellow");
    const ui = layer(el, 1);
    const svg = G3M.svgLayer(layer(el, 2), 1920, 1080);
    const box = G3M.TypeBox(ui, { x: 470, y: 600, width: 1250, placeholder: cfg.placeholder || "Ask g3po to…",
      speed: cfg.speed ?? 55, seed: cfg.seed ?? 5, at: 500 });
    const script = cfg.script || [["type", "Fix this issue"], ["pause", 420], ["delete", "issue"],
      ["type", "entire bloody thing"], ["pause", 360], ["submit"]];
    const marks = [];
    for (const [op, a, b] of script) {
      const before = box.end;
      if (op === "type") box.type(a, b || {});
      else if (op === "pause") box.pause(a);
      else if (op === "delete") box.delete(a);
      else if (op === "replace") box.replace(a, b);
      else if (op === "complete") box.complete(a);
      else if (op === "submit") box.submit();
      marks.push({ op, from: before, to: box.end });
    }
    const del = marks.find(m => m.op === "delete");
    const sub = marks.find(m => m.op === "submit");
    const g3 = G3M.G3(svg);
    const end = box.end;
    return {
      duration: cfg.duration ?? end + 900,
      render(t) {
        box.render(t);
        const life = G3M.g3Life.idle(t, 2);
        const suspicious = del && t >= del.from && t < del.to + 500;
        const after = sub && t >= sub.from;
        const len = (box.el.querySelector("span") || {}).textContent?.length || 0;
        g3.set({ x: 290, y: 860, scale: 1.4,
          lookX: after ? 0 : clamp(-.2 + len / 22, -.2, 1), lookY: .45,
          eyes: suspicious ? "squint" : after && t > sub.from + 250 ? "happy" : "round",
          blink: suspicious ? 0 : life.blink, squash: life.squash + (after ? kf(t - sub.from, [[0, 0], [120, .16], [300, -.08, E.outQuad], [460, 0, E.outQuad]]) : 0),
          lift: after ? kf(t - sub.from, [[120, 0], [330, 90, E.outQuad], [560, 0, E.inQuad]]) : 0,
          armL: after && t > sub.from + 200 ? 150 : 0, armR: after && t > sub.from + 200 ? 150 : 0,
          tilt: suspicious ? -9 : 0, antenna: life.antenna });
      }
    };
  };

})(window.G3M = window.G3M || {});

</script>
<script>/* scenes/mascots.js */
/* Scenes where the characters carry the idea. */
(function (G3M) {
  "use strict";
  const { h, css, s, set, C, kf, ease: E, clamp } = G3M;
  const S = G3M.scenes;
  const layer = G3M.sceneLayer;
  const L = G3M.g3Life;

  // ------------------------------------------------------------ MascotReaction
  /* A reel of G3's small moves. Tiny movements are funnier than big ones. */
  S.reactions = function (el, cfg) {
    el.style.background = G3M.color(cfg.background || "yellow");
    const svg = G3M.svgLayer(layer(el, 1), 1920, 1080);
    const g3 = G3M.mascot(cfg.mascot || "g3", svg);
    const beats = { glanceL: 600, glanceR: 880, center: 1160, blink: 1450, dbl: 1900, tilt: 2400,
                    surprise: 3150, proud: 3900, wave: 4650 };
    return {
      duration: cfg.duration ?? 5900,
      render(t) {
        const b = beats, life = L.idle(t, 3);
        const pop = kf(t, [[0, 0], [300, 1.12, E.outCubic], [420, .96], [540, 1, E.outQuad]]);
        const lookX = kf(t, [[b.glanceL - 60, 0], [b.glanceL, -1, E.outQuad], [b.glanceR - 60, -1],
          [b.glanceR, 1, E.outQuad], [b.center - 60, 1], [b.center, 0, E.outQuad],
          [b.tilt, 0], [b.tilt + 150, .9, E.outQuad], [b.surprise - 100, .9], [b.surprise, 0]]);
        const tilt = kf(t, [[b.tilt, 0], [b.tilt + 260, 13, E.pop], [b.surprise - 120, 13], [b.surprise, 0, E.outQuad]]);
        const suspicious = t >= b.tilt + 150 && t < b.surprise;
        const surprised = t >= b.surprise && t < b.proud;
        const proud = t >= b.proud;
        const hop = surprised ? kf(t - b.surprise, [[0, 0], [160, 120, E.outQuad], [360, 0, E.inQuad]]) : 0;
        const landSq = surprised ? kf(t - b.surprise, [[0, .14], [80, -.12], [360, -.05], [440, .16, E.outQuad], [620, 0, E.bouncy]]) : 0;
        const proudSq = proud ? kf(t - b.proud, [[0, 0], [120, .12], [320, -.06, E.outQuad], [480, 0, E.outQuad]]) : 0;
        const wave = t >= b.wave ? Math.sin((t - b.wave) / 110) * 22 : 0;
        g3.set({
          x: 960, y: 900, scale: (cfg.scale ?? 1.9) * pop,
          lookX, tilt, lift: hop,
          eyes: surprised ? "wide" : proud ? "happy" : "round",
          blink: suspicious ? .45 : Math.max(L.blink(t, b.blink), L.doubleBlink(t, b.dbl), t > b.wave + 500 ? life.blink : 0),
          squash: landSq + proudSq + life.squash,
          armL: proud && t < b.wave ? kf(t - b.proud, [[0, 0], [260, 150, E.pop]]) : proud ? 20 : 0,
          armR: proud ? (t < b.wave ? kf(t - b.proud, [[0, 0], [260, 150, E.pop]]) : 145 + wave) : 0,
          antenna: L.twang(t, b.surprise + 360, 30) + L.twang(t, b.proud + 200, 16) + life.antenna,
          mouth: surprised ? "o" : "none"
        });
      }
    };
  };

  // ------------------------------------------------------------ Button gag
  /* G3 presses the button. Nothing. He looks at the camera. Then everything. */
  S.buttonGag = function (el, cfg) {
    el.style.background = G3M.color(cfg.background || "white");
    const svg = G3M.svgLayer(layer(el, 1), 1920, 1080);
    const burst = s("g", {}, svg);
    const bx = 1180, by = 900;
    const btn = s("g", {}, svg);
    s("ellipse", { cx: bx, cy: by + 6, rx: 190, ry: 40, fill: "rgba(28,29,31,.15)" }, btn);
    s("rect", { x: bx - 170, y: by - 60, width: 340, height: 70, rx: 30, fill: C.ink }, btn);
    const cap = s("g", {}, btn);
    s("rect", { x: bx - 140, y: by - 120, width: 280, height: 90, rx: 45, fill: G3M.color(cfg.buttonColor || "red") }, cap);
    s("rect", { x: bx - 104, y: by - 110, width: 120, height: 22, rx: 11, fill: "rgba(255,255,255,.38)" }, cap);
    const g3 = G3M.G3(svg);
    const pressAt = 1150, lookAt = 1750, goAt = 2500;
    const rnd = G3M.rng(11), items = [];
    const kinds = ["card", "g3", "card", "pill", "g3", "card", "circle", "pill", "card", "g3", "circle", "card", "pill", "g3"];
    kinds.forEach((k, i) => {
      const a = -Math.PI * (.08 + .84 * (i / (kinds.length - 1))) + (rnd() - .5) * .25;
      items.push({ k, a, v: 1300 + rnd() * 900, spin: (rnd() - .5) * 720, delay: rnd() * 120, g: s("g", {}, burst) });
    });
    for (const it of items) {
      if (it.k === "card") {
        s("rect", { x: -90, y: -52, width: 180, height: 104, rx: 18, fill: "#fff", stroke: C.ink, "stroke-width": 7 }, it.g);
        s("circle", { cx: -48, cy: 0, r: 20, fill: C.green }, it.g);
        s("rect", { x: -16, y: -14, width: 84, height: 12, rx: 6, fill: "#C9CCD0" }, it.g);
        s("rect", { x: -16, y: 8, width: 56, height: 12, rx: 6, fill: "#C9CCD0" }, it.g);
      } else if (it.k === "g3") {
        s("rect", { x: -64, y: -44, width: 128, height: 88, rx: 42, fill: C.yellow, stroke: C.ink, "stroke-width": 7 }, it.g);
        s("circle", { cx: -22, cy: -4, r: 13, fill: C.ink }, it.g); s("circle", { cx: 22, cy: -4, r: 13, fill: C.ink }, it.g);
      } else if (it.k === "pill") {
        s("rect", { x: -80, y: -26, width: 160, height: 52, rx: 26, fill: C.ink }, it.g);
      } else {
        s("circle", { cx: 0, cy: 0, r: 34, fill: C.yellow, stroke: C.ink, "stroke-width": 7 }, it.g);
      }
    }
    return {
      duration: cfg.duration ?? 3900,
      render(t) {
        // walk in, press, wait, look at camera, launch
        const walking = t < 900;
        const x = kf(t, [[0, 360], [900, 900, E.outQuad]]);
        const st = walking ? L.stride(t, 1) : {};
        const pressing = t >= pressAt - 150 && t < pressAt + 420;
        const armR = pressing ? kf(t - (pressAt - 150), [[0, 20], [150, 95, E.outQuad], [420, 60, E.outQuad]]) : 20;
        const capY = kf(t, [[pressAt - 10, 0], [pressAt + 60, 22, E.outQuad], [pressAt + 360, 0, E.pop],
                            [goAt - 40, 0], [goAt + 40, 26, E.outQuad], [goAt + 300, 0, E.pop]]);
        set(cap, { transform: `translate(0,${capY})` });
        const looking = t >= lookAt && t < goAt;
        const blown = t >= goAt;
        const blowX = blown ? kf(t - goAt, [[0, 0], [260, -210, E.outCubic]]) : 0;
        g3.set({
          x: x + blowX, y: 960, scale: 1.25, ...st,
          armR: walking ? st.armR : blown ? 150 : armR, armL: blown ? 150 : walking ? st.armL : 0,
          lookX: looking ? 0 : blown ? 1 : .7, lookY: looking ? .35 : .5,
          blink: looking ? L.blink(t, lookAt + 380) : 0,
          eyes: blown ? "wide" : "round", mouth: blown ? "o" : "none",
          lift: blown ? kf(t - goAt, [[0, 0], [180, 110, E.outQuad], [420, 0, E.inQuad]]) : (st.lift || 0),
          rot: blown ? kf(t - goAt, [[0, 0], [200, -14, E.outQuad], [600, 0, E.outQuad]]) : 0,
          squash: blown ? kf(t - goAt, [[420, 0], [500, .2], [700, 0, E.bouncy]]) : 0,
          antenna: L.twang(t, goAt, 40) + (looking ? 0 : Math.sin(t / 300) * 3)
        });
        // the launch
        for (const it of items) {
          const d = (t - goAt - it.delay) / 1000;
          if (d < 0) { set(it.g, { opacity: 0 }); continue; }
          const px = bx + Math.cos(it.a) * it.v * d;
          const py = by - 90 + Math.sin(it.a) * it.v * d + 900 * d * d;
          const sc = kf(d, [[0, .2], [.12, 1.15, E.outQuad], [.25, 1]]);
          set(it.g, { opacity: 1, transform: `translate(${px},${py}) rotate(${it.spin * d}) scale(${sc})` });
        }
      }
    };
  };

  // ------------------------------------------------------------ AgentMultiplication
  /* Parallel agents: one object splits into many. G3 charges up, pops, and his
   * friends shoot out along arcs. Then he tries to keep track of them all. */
  S.agents = function (el, cfg) {
    el.style.background = G3M.color(cfg.background || "yellow");
    const svg = G3M.svgLayer(layer(el, 1), 1920, 1080);
    const arrows = s("g", {}, svg);
    const cast = (cfg.agents || ["g2d2", "gb8", "pix", "dj", "g3"]).slice(0, 7);
    const home = [960, 1000];
    const spots = [[330, 720], [560, 420], [960, 330], [1360, 420], [1590, 720], [250, 420], [1670, 420]];
    const who = cast.map((name, i) => ({ name, m: G3M.mascot(name, svg), to: spots[i], at: 820 + i * 95 }));
    const paths = who.map(w => s("path", { fill: "none", stroke: C.ink, "stroke-width": 12, "stroke-linecap": "round" }, arrows));
    const heads = who.map(() => s("path", { fill: C.ink }, arrows));
    const g3 = G3M.G3(svg);
    return {
      duration: cfg.duration ?? 3600,
      render(t) {
        const charge = kf(t, [[250, 0], [700, .24, E.inOutQuad], [790, -.16, E.outQuad], [950, .05], [1100, 0, E.outQuad]]);
        const shake = t > 450 && t < 780 ? Math.sin(t / 18) * 5 : 0;
        const look = kf(t, [[1500, 0], [1580, -1, E.outQuad], [1760, -1], [1830, 1, E.outQuad],
                            [2010, 1], [2080, -1, E.outQuad], [2200, -1], [2270, 1, E.outQuad], [2420, 1], [2500, 0, E.outQuad]]);
        g3.set({ x: home[0] + shake, y: home[1], scale: 1.15, squash: charge,
          eyes: t > 450 && t < 790 ? "squint" : t > 2650 ? "happy" : "round", lookX: look,
          blink: L.doubleBlink(t, 2560), antenna: L.twang(t, 790, 34),
          armL: t > 2700 ? kf(t - 2700, [[0, 0], [240, 140, E.pop]]) : 0,
          armR: t > 2700 ? kf(t - 2700, [[0, 0], [240, 140, E.pop]]) : 0 });
        who.forEach((w, i) => {
          const d = t - w.at;
          const p = E.outCubic(clamp(d / 520));
          const [x, y] = G3M.curve([home[0], home[1] - 150], w.to, p, (i < cast.length / 2 ? -1 : 1) * .22);
          const lift = d >= 0 && d < 520 ? Math.sin(p * Math.PI) * 40 : 0;
          const land = d - 520;
          const sq = land >= 0 ? kf(land, [[0, .22], [110, -.08, E.outQuad], [240, 0, E.outQuad]]) : -.1;
          const sc = d < 0 ? 0 : kf(d, [[0, .15], [200, .62, E.outQuad], [520, .78]]);
          w.m.set({ x, y, scale: sc, squash: sq, lift, lookX: land > 300 ? (w.to[0] < 960 ? .6 : -.6) : 0,
            blink: L.blink(t, w.at + 1100 + i * 170), opacity: d < 0 ? 0 : 1, roll: d * .3 });
          // arrow traces the flight
          const ap = E.outCubic(clamp((d + 60) / 420));
          const pts = [];
          for (let k = 0; k <= 16; k++) pts.push(G3M.curve([home[0], home[1] - 190], [w.to[0], w.to[1] + 30], k / 16 * ap * .82, (i < cast.length / 2 ? -1 : 1) * .22));
          paths[i].setAttribute("d", "M" + pts.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" L"));
          const fade = 1 - clamp((t - 2200) / 400);
          paths[i].setAttribute("opacity", d > -60 ? fade : 0);
          const a = pts[pts.length - 1], b = pts[pts.length - 2] || a;
          const ang = Math.atan2(a[1] - b[1], a[0] - b[0]);
          const hd = [[a[0] + Math.cos(ang) * 22, a[1] + Math.sin(ang) * 22],
                      [a[0] + Math.cos(ang + 2.3) * 22, a[1] + Math.sin(ang + 2.3) * 22],
                      [a[0] + Math.cos(ang - 2.3) * 22, a[1] + Math.sin(ang - 2.3) * 22]];
          heads[i].setAttribute("d", "M" + hd.map(q => q.join(",")).join(" L") + " Z");
          heads[i].setAttribute("opacity", d > 0 ? fade : 0);
        });
      }
    };
  };

  // ------------------------------------------------------------ Converge / DONE.
  /* Orchestration: many objects converge into one clean result. */
  S.converge = function (el, cfg) {
    el.style.background = G3M.color(cfg.background || "yellow");
    const inner = layer(el, 1);            // shaken; the background stays put
    const svg = G3M.svgLayer(layer(inner, 1), 1920, 1080);
    const textLayer = layer(inner, 2);
    const bt = G3M.BigText(textLayer, { text: [cfg.text || "DONE."], width: .66, stretch: 72, color: "ink" });
    bt.el.style.transform = "translateY(-300px)";
    const g3 = G3M.G3(svg);
    const n = cfg.count ?? 6, rnd = G3M.rng(4);
    const ticks = [C.green, C.blue, C.red, C.green, C.green, C.blue, C.green];
    const cards = [];
    for (let i = 0; i < n; i++) {
      const g = s("g", {}, svg);
      s("rect", { x: -120, y: -56, width: 240, height: 112, rx: 22, fill: "#fff", stroke: C.ink, "stroke-width": 8 }, g);
      s("circle", { cx: -64, cy: 0, r: 26, fill: ticks[i % ticks.length] }, g);
      s("path", { d: "M-76,0 l9,10 l18,-20", fill: "none", stroke: "#fff", "stroke-width": 8, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
      s("rect", { x: -24, y: -18, width: 110, height: 14, rx: 7, fill: "#C9CCD0" }, g);
      s("rect", { x: -24, y: 8, width: 76, height: 14, rx: 7, fill: "#C9CCD0" }, g);
      const side = i % 2 ? 1 : -1;
      const start = [960 + side * (1150 + rnd() * 200), 250 + rnd() * 600];
      const a = Math.PI * (1.15 + i / (n - 1) * .7);
      const ring = [960 + Math.cos(a) * 560, 780 + Math.sin(a) * 330];
      cards.push({ g, start, ring, rot: (rnd() - .5) * 40, at: 200 + i * 110 });
    }
    const result = s("g", {}, svg);
    s("rect", { x: -170, y: -80, width: 340, height: 160, rx: 30, fill: C.ink }, result);
    s("path", { d: "M-52,4 l34,34 l72,-76", fill: "none", stroke: C.yellow, "stroke-width": 22, "stroke-linecap": "round", "stroke-linejoin": "round" }, result);
    const mergeAt = 1500, doneAt = 2050;
    return {
      duration: cfg.duration ?? 3500,
      render(t) {
        cards.forEach((c, i) => {
          const d = t - c.at;
          const p = E.outBack(1.3)(clamp(d / 560));
          let [x, y] = G3M.curve(c.start, c.ring, clamp(p, 0, 1.2), .12);
          let sc = 1, rot = c.rot * (1 - clamp(p));
          const m = clamp((t - mergeAt - i * 30) / 360);
          if (m > 0) {
            const q = E.inBack(1.6)(m);
            x = G3M.lerp(x, 960, q); y = G3M.lerp(y, 560, q); sc = 1 - E.inQuad(m) * .8; rot = rot * (1 - m);
          }
          set(c.g, { transform: `translate(${x},${y}) rotate(${rot}) scale(${sc})`, opacity: d < 0 || m >= 1 ? 0 : 1 });
        });
        const r = t - (mergeAt + 330);
        const rs = r < 0 ? 0 : kf(r, [[0, .2], [220, 1.15, E.outCubic], [340, .95], [460, 1, E.outQuad]]);
        set(result, { transform: `translate(960,560) scale(${rs})`, opacity: r < 0 ? 0 : 1 });
        G3M.animateText(bt, t - doneAt, { entrance: "slam", rotate: -2 });
        const cheer = t > mergeAt + 400;
        g3.set({ x: 960, y: 1030, scale: .95, eyes: cheer ? "happy" : "round",
          lookY: cheer ? 0 : -.6, lookX: Math.sin(t / 240) * (cheer ? 0 : .8),
          armL: cheer ? kf(t - mergeAt - 400, [[0, 0], [220, 150, E.pop]]) : 0,
          armR: cheer ? kf(t - mergeAt - 400, [[0, 0], [220, 150, E.pop]]) : 0,
          squash: cheer ? kf(t - mergeAt - 400, [[0, .1], [200, -.06, E.outQuad], [360, 0, E.outQuad]]) : 0,
          lift: t > doneAt + 210 ? kf(t - doneAt - 210, [[0, 0], [160, 70, E.outQuad], [340, 0, E.inQuad]]) : 0,
          antenna: L.twang(t, doneAt + 210, 30) });
        const [sx, sy] = G3M.shake(t, doneAt + 210, 300, 16, 9);
        inner.style.transform = `translate(${sx}px,${sy}px)`;
      }
    };
  };

})(window.G3M = window.G3M || {});

</script>
<script>/* scenes/logo.js */
/* The g3po logo ident.
 *
 * A yellow ribbon flows in, curls into a spiral, and the spiral becomes G3's
 * head. The letters snap in, the eyes open, look left, look right, and smile.
 * The loop version unwinds back into the ribbon and flows out, so it can
 * repeat forever without a seam.
 */
(function (G3M) {
  "use strict";
  const { h, css, s, set, C, kf, ease: E, clamp } = G3M;
  const S = G3M.scenes;
  const layer = G3M.sceneLayer;

  const HX = 800, HY = 400, HW = 500, HH = 340, HR = 165, HROT = -9;

  function polyLen(pts) {
    let L = 0; const acc = [0];
    for (let i = 1; i < pts.length; i++) { L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); acc.push(L); }
    return { L, acc };
  }
  function spiral(cx, cy, r0, r1, a0, turns, n, ry = .72) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const u = i / n, a = a0 + turns * Math.PI * 2 * u, r = G3M.lerp(r0, r1, E.inOutQuad(u));
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r * ry]);
    }
    return pts;
  }
  // flows in from the left, then curls clockwise down into the head's centre
  function entryPath() {
    const pts = [];
    for (let i = 0; i <= 40; i++) {
      const u = i / 40, x = -260 + u * 700;
      pts.push([x, 820 - Math.sin(u * Math.PI * 1.4) * 170 - u * 60]);
    }
    const last = pts[pts.length - 1];
    const a0 = Math.atan2((last[1] - HY) / .72, last[0] - HX);
    const r0 = Math.hypot(last[0] - HX, (last[1] - HY) / .72);
    return pts.concat(spiral(HX, HY, r0, 0, a0, 1.6, 90).slice(1));
  }
  // unwinds from the head's centre and flows off to the right
  function exitPath() {
    const sp = spiral(HX, HY, 0, 470, Math.PI * .6, 1.4, 80);
    const last = sp[sp.length - 1], pts = sp.slice();
    for (let i = 1; i <= 40; i++) {
      const u = i / 40;
      pts.push([last[0] + u * (2300 - last[0]), last[1] + Math.sin(u * Math.PI * 1.3) * 150]);
    }
    return pts;
  }

  G3M.Logo = function Logo(parent, cfg = {}) {
    const svg = G3M.svgLayer(parent, 1920, 1080);
    const yellow = G3M.color(cfg.color || "yellow"), ink = C.ink;
    const inPts = entryPath(), outPts = exitPath();
    const inM = polyLen(inPts), outM = polyLen(outPts);
    const d = pts => "M" + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L");
    const ribbonG = s("g", {}, svg);
    const mkRibbon = pts => ({
      under: s("path", { d: d(pts), fill: "none", stroke: ink, "stroke-width": 92, "stroke-linecap": "round", "stroke-linejoin": "round" }, ribbonG),
      over: s("path", { d: d(pts), fill: "none", stroke: yellow, "stroke-width": 62, "stroke-linecap": "round", "stroke-linejoin": "round" }, ribbonG)
    });
    const rIn = mkRibbon(inPts), rOut = mkRibbon(outPts);

    const mark = s("g", {}, svg);
    // letters first, so the head overlaps the top of the g the way the mark does
    // All outlines are drawn first, then all fills, so overlapping letters
    // fuse into one sticker silhouette the way the printed mark does.
    const wordStroke = s("g", {}, mark), wordFill = s("g", {}, mark);
    const letters = [];
    const chars = (cfg.wordmark || "g3po").split("");
    const size = 330;
    let x = 560;
    const glyph = (parent, ch, attrs) => {
      const g = s("g", {}, parent);
      const tx = s("text", { x: 0, y: 0, "font-size": size, "font-weight": 900, "font-family": G3M.FONT,
        "text-anchor": "middle", text: ch, ...attrs }, g);
      tx.style.fontStretch = "88%";
      return g;
    };
    for (const ch of chars) {
      const gs = glyph(wordStroke, ch, { fill: ink, stroke: ink, "stroke-width": 34, "stroke-linejoin": "round" });
      const gf = glyph(wordFill, ch, { fill: yellow });
      letters.push({ gs, gf, ch });
    }
    // measure and lay out the letters on a common baseline
    let adv = letters.map(l => G3M.measureText(l.ch, { fontSize: size + "px", fontStretch: "88%" }));
    if (!adv.every(a => a > 0)) adv = letters.map(l => l.ch === "3" ? 190 : l.ch === "p" || l.ch === "g" ? 205 : 200);
    letters.forEach((l, i) => { l.cx = x + adv[i] / 2; l.cy = 850; x += adv[i] - 8; });

    const head = s("g", {}, mark);
    const ant = s("g", {}, head);
    s("path", { d: `M0,${-HH / 2 + 8} L0,${-HH / 2 - 70}`, stroke: ink, "stroke-width": 30, "stroke-linecap": "round" }, ant);
    s("path", { d: `M0,${-HH / 2 + 8} L0,${-HH / 2 - 70}`, stroke: "#B9BCC0", "stroke-width": 14, "stroke-linecap": "round" }, ant);
    s("circle", { cx: 0, cy: -HH / 2 - 88, r: 30, fill: C.red, stroke: ink, "stroke-width": 12 }, ant);
    s("rect", { x: -HW / 2, y: -HH / 2, width: HW, height: HH, rx: HR, fill: yellow, stroke: ink, "stroke-width": 30 }, head);
    const cheeks = s("g", {}, head);
    s("circle", { cx: -168, cy: 66, r: 34, fill: C.cheek, opacity: .9 }, cheeks);
    s("circle", { cx: 168, cy: 66, r: 34, fill: C.cheek, opacity: .9 }, cheeks);
    const eyes = s("g", {}, head);
    const discs = [], happy = s("g", {}, head);
    for (const ex of [-96, 96]) {
      const e = s("g", {}, eyes);
      const disc = s("g", {}, e);
      s("circle", { cx: 0, cy: 0, r: 64, fill: ink }, disc);
      s("circle", { cx: -20, cy: -22, r: 21, fill: "#fff" }, disc);
      s("circle", { cx: 22, cy: 24, r: 9, fill: "#C9CCD0" }, disc);
      discs.push({ e, disc, ex });
      s("path", { d: `M${ex - 40},${14} Q${ex},${-40} ${ex + 40},${14}`, fill: "none", stroke: ink,
        "stroke-width": 24, "stroke-linecap": "round" }, happy);
    }
    const sparks = s("g", {}, mark);
    const sp = [[-.9, -.95], [-.2, -1.15], [.55, -1.0]];
    const sparkEls = sp.map(() => s("path", { stroke: ink, "stroke-width": 16, "stroke-linecap": "round" }, sparks));

    let tag = null;
    if (cfg.tagline) {
      tag = h("div", { text: cfg.tagline }, parent);
      css(tag, { position: "absolute", left: "0", right: "0", top: "992px", textAlign: "center",
        fontFamily: G3M.FONT, fontWeight: 800, fontSize: "40px", letterSpacing: ".22em", textTransform: "uppercase",
        color: ink, opacity: 0 });
    }

    function ribbon(r, M, s0, s1) {
      const len = Math.max(0, s1 - s0);
      for (const p of [r.under, r.over]) {
        p.setAttribute("stroke-dasharray", `${len} ${M.L + 400}`);
        p.setAttribute("stroke-dashoffset", String(-s0));
        p.setAttribute("opacity", len > 1 ? 1 : 0);
      }
    }

    return {
      svg, tag, inLen: inM.L, outLen: outM.L,
      /* state: { rin:[s0,s1], rout:[s0,s1], head:{sc,rot}, letters:[{y,sc,rot,op}],
       *          eyes:{sc,lookX,blink,happy}, cheeks, antenna:{sc,rot}, sparks, squash, tag } */
      set(st) {
        ribbon(rIn, inM, ...(st.rin || [0, 0]));
        ribbon(rOut, outM, ...(st.rout || [0, 0]));
        const hd = st.head || { sc: 0 };
        set(head, { transform: `translate(${HX},${HY}) rotate(${HROT + (hd.rot || 0)}) scale(${Math.max(0, hd.sc)})`,
          opacity: hd.sc > .01 ? 1 : 0 });
        letters.forEach((l, i) => {
          const f = (st.letters && st.letters[i]) || { sc: 0, op: 0 };
          const tr = { transform: `translate(${l.cx},${l.cy + (f.y || 0)}) rotate(${f.rot || 0}) scale(${Math.max(0, f.sc ?? 1)})`,
            opacity: f.op ?? 1 };
          set(l.gs, tr); set(l.gf, tr);
        });
        const ey = st.eyes || { sc: 0 };
        discs.forEach(dd => {
          set(dd.e, { transform: `translate(${dd.ex},-8) scale(${Math.max(0, ey.sc)},${Math.max(.05, ey.sc * (1 - (ey.blink || 0)))})`,
            opacity: ey.happy ? 0 : 1 });
          set(dd.disc, { transform: `translate(${(ey.lookX || 0) * 26},${(ey.lookY || 0) * 12})` });
        });
        set(happy, { opacity: ey.happy ? 1 : 0, transform: `translate(0,-8)` });
        set(cheeks, { opacity: st.cheeks ?? 0, transform: `translate(0,${ey.happy ? -8 : 0})` });
        const an = st.antenna || { sc: 0 };
        set(ant, { transform: `rotate(${an.rot || 0} 0 ${-HH / 2}) scale(1,${Math.max(0, an.sc)})`,
          opacity: an.sc > .02 ? 1 : 0 });
        const sq = st.squash || 0;
        set(mark, { transform: `translate(960,1000) scale(${1 + sq * .6},${1 - sq}) translate(-960,-1000)` });
        const k = st.sparks || 0;
        sparkEls.forEach((el, i) => {
          const [dx, dy] = sp[i];
          const cx = HX + dx * HW * .62, cy = HY + dy * HH * .62;
          const len = 26 + k * 22, off = 10 + k * 26;
          const a = Math.atan2(dy, dx);
          el.setAttribute("d", `M${cx + Math.cos(a) * off},${cy + Math.sin(a) * off} l${Math.cos(a) * len},${Math.sin(a) * len}`);
          el.setAttribute("opacity", k > 0 && k < 1 ? 1 - k * .5 : 0);
        });
        if (tag) { tag.style.opacity = st.tag ?? 0; tag.style.transform = `translateY(${(1 - (st.tag ?? 0)) * 26}px)`; }
      }
    };
  };

  /* The shared build-up, 0 -> ~3000 ms. Returns a logo state for time t. */
  function identState(t, logo, cfg) {
    const ribbonEnd = 920;
    const s1 = logo.inLen * E.inOutCubic(clamp(t / ribbonEnd));
    const s0 = Math.max(0, s1 - 1200) + logo.inLen * E.inQuad(clamp((t - ribbonEnd + 160) / 300));
    const head = { sc: kf(t, [[ribbonEnd - 90, 0], [ribbonEnd + 170, 1.1, E.outCubic], [ribbonEnd + 300, .96], [ribbonEnd + 420, 1, E.outQuad]]),
                   rot: kf(t, [[ribbonEnd - 90, -40], [ribbonEnd + 360, 0, E.pop]]) };
    const letters = [0, 1, 2, 3].map(i => {
      const lt = t - (1120 + i * 85);
      return lt < 0 ? { sc: 0, op: 0 } : {
        y: kf(lt, [[0, 170], [230, -18, E.outCubic], [360, 0, E.outQuad]]),
        sc: kf(lt, [[0, .4], [230, 1.08, E.outCubic], [360, 1, E.outQuad]]),
        rot: kf(lt, [[0, (i % 2 ? 14 : -14)], [360, 0, E.pop]]), op: 1 };
    });
    const eyeSc = kf(t, [[1520, 0], [1680, 1.16, E.outCubic], [1800, 1, E.outQuad]]);
    // the beat: left, hold, right, hold, smile
    const L1 = 2020, R1 = L1 + 90 + 150, C1 = R1 + 90 + 130, SMILE = C1 + 70;
    const lookX = kf(t, [[L1, 0], [L1 + 90, -1, E.outQuad], [R1, -1], [R1 + 90, 1, E.outQuad], [C1, 1], [C1 + 70, 0, E.outQuad]]);
    const happy = t >= SMILE;
    const antOn = cfg.antenna !== false;
    const antenna = antOn ? { sc: kf(t, [[SMILE + 40, 0], [SMILE + 200, 1.15, E.outCubic], [SMILE + 320, 1, E.outQuad]]),
                              rot: G3M.g3Life.twang(t, SMILE + 200, 16) } : { sc: 0 };
    const squash = kf(t, [[SMILE + 260, 0], [SMILE + 330, .03, E.outQuad], [SMILE + 520, 0, E.settle]]);
    return {
      rin: [s0, s1], rout: [0, 0], head, letters,
      eyes: { sc: eyeSc, lookX, happy, blink: G3M.g3Life.blink(t, 1880) },
      cheeks: clamp((t - 1650) / 200), antenna, squash,
      sparks: clamp((t - SMILE) / 520),
      tag: E.outCubic(clamp((t - (SMILE + 160)) / 420))
    };
  }

  // ------------------------------------------------------------ LogoIdent
  S.logo = function (el, cfg) {
    el.style.background = G3M.color(cfg.background || "white");
    const logo = G3M.Logo(layer(el, 1), cfg);
    return { duration: cfg.duration ?? 3600, render(t) { logo.set(identState(t, logo, cfg)); } };
  };

  // ------------------------------------------------------------ LogoLoop
  /* Seamless: frame 0 and the final frame are both an empty stage, and the
   * ribbon that leaves on the right is the same motion that arrives on the
   * left, so it reads as one continuous flow. */
  S.logoLoop = function (el, cfg) {
    el.style.background = G3M.color(cfg.background || "white");
    const logo = G3M.Logo(layer(el, 1), { ...cfg, tagline: null });
    const D = cfg.duration ?? 5400, OUT = D - 1350;
    return {
      duration: D, loop: true,
      render(t) {
        const st = identState(Math.min(t, OUT), logo, cfg);
        if (t > OUT) {
          const d = t - OUT;
          const shrink = E.inBack(1.7)(clamp(d / 420));
          st.head = { sc: 1 - shrink, rot: shrink * 40 };
          st.letters = st.letters.map((l, i) => {
            const q = E.inBack(1.7)(clamp((d - (3 - i) * 40) / 380));
            return { ...l, sc: 1 - q, y: q * 40 };
          });
          st.eyes = { ...st.eyes, sc: 1 - shrink };
          st.antenna = { sc: 1 - shrink, rot: 0 };
          st.cheeks = 1 - shrink; st.sparks = 0;
          const u = clamp((d - 160) / 1150);
          const s1 = logo.outLen * E.inOutCubic(u);
          const s0 = Math.max(0, s1 - 1200) + logo.outLen * E.inQuad(clamp((d - 900) / 450));
          st.rout = [Math.min(s0, s1), s1];
        }
        logo.set(st);
      }
    };
  };

  // ------------------------------------------------------------ EndCard
  S.endCard = function (el, cfg) {
    el.style.background = G3M.color(cfg.background || "white");
    const logo = G3M.Logo(layer(el, 1), { ...cfg, tagline: cfg.tagline ?? "Agents for a brighter tomorrow" });
    let cta = null;
    if (cfg.cta) {
      cta = h("div", { text: cfg.cta }, layer(el, 2));
      css(cta, { position: "absolute", right: "140px", top: "470px", background: C.ink, color: C.white,
        fontFamily: G3M.FONT, fontWeight: 900, fontSize: "56px", padding: "26px 52px", borderRadius: "60px" });
    }
    return {
      duration: cfg.duration ?? 2600,
      render(t) {
        const base = identState(3400, logo, cfg);   // the settled mark
        const pop = kf(t, [[0, .6], [260, 1.05, E.outCubic], [400, 1, E.outQuad]]);
        base.head.sc = pop;
        base.letters = base.letters.map((l, i) => ({ ...l, sc: kf(t - i * 50, [[0, .5], [260, 1.05, E.outCubic], [380, 1, E.outQuad]]) }));
        base.eyes = { ...base.eyes, happy: t > 1500, lookX: kf(t, [[700, 0], [790, -1, E.outQuad], [1100, -1], [1190, 0, E.outQuad]]),
          blink: G3M.g3Life.blink(t, 1300) };
        base.sparks = t > 1500 ? clamp((t - 1500) / 500) : 0;
        logo.set(base);
        if (cta) G3M.applyTransform(cta, G3M.textIn.pop(t - 500));
      }
    };
  };

})(window.G3M = window.G3M || {});

</script>
<script>/* motion/director.js */
/* G3Video — the declarative scripting layer.
 *
 *   new G3Video(stage)
 *     .scene("hero", { title: "MEET G3PO" })
 *     .transition("circleExplosion")
 *     .scene("video", { src: "./recordings/agents.mp4" })
 *     .cursor({ x: 1200, y: 620 }).click()
 *     .zoom({ x: .72, y: .34, scale: 2.4 })
 *     .text("EVERYWHERE.", { animation: "slam" })
 *     .transition("g3Run")
 *     .scene("endCard", { cta: "Try g3po" });
 *
 * Every call appends to one Timeline, so the whole promo is a pure function
 * of time: scrub it, loop it, or export it frame by frame.
 */
(function (G3M) {
  "use strict";
  const { h, css, s, set, C, kf, ease: E, clamp } = G3M;

  G3M.G3Video = class G3Video {
    constructor(stage, opts = {}) {
      this.stage = stage;
      this.tl = new G3M.Timeline();
      this.t = 0;
      this.cur = null;
      this.pending = null;
      this.fps = opts.fps || 60;
      this._cursor = null;
    }
    get duration() { return this.tl.duration; }
    timeline() { return this.tl; }

    // ---------------------------------------------------------------- scenes
    scene(type, cfg = {}) {
      const make = G3M.scenes[type];
      if (!make) throw new Error(`Unknown scene "${type}". Available: ${Object.keys(G3M.scenes).join(", ")}`);
      const el = h("div", { class: "g3-scene", "data-scene": type }, this.stage.scenes);
      css(el, { ...G3M.fill, display: "none", overflow: "hidden" });
      const sc = make(el, cfg, this.stage);
      const rec = { type, el, sc, start: this.t, from: this.t, to: Infinity };

      // the cursor belongs to the scene it was used in; it leaves with it
      if (this._cursor && !this._cursor._hidden && this.cur) {
        this._cursor.hide({ at: this.t }); this._cursor._hidden = true;
      }
      if (this.pending && this.cur) {
        const { name, cfg: tcfg } = this.pending;
        const prev = this.cur;
        const mid = h("div", {}, this.stage.scenes);
        css(mid, { ...G3M.fill, display: "none" });
        const fx = h("div", {}, this.stage.fx);
        css(fx, { ...G3M.fill, display: "none" });
        const makeT = G3M.transitions[name];
        if (!makeT) throw new Error(`Unknown transition "${name}". Available: ${Object.keys(G3M.transitions).join(", ")}`);
        const tr = makeT({ stage: this.stage, from: prev.el, to: el, mid, fx }, tcfg);
        const t0 = this.t, D = tr.duration;
        prev.to = t0 + D;
        // visible from the moment the transition starts revealing it, but its
        // own entrance is timed to land as it comes into view
        rec.from = t0;
        rec.start = t0 + D * (tcfg.introAt ?? tr.introAt ?? .45);
        const clear = () => {
          for (const e of [prev.el, el]) {
            e.style.clipPath = ""; e.style.transform = ""; e.style.visibility = "";
            e.style.zIndex = ""; e.style.boxShadow = ""; e.style.transformOrigin = "";
          }
          mid.style.display = "none"; fx.style.display = "none";
        };
        this.tl.add((lt, state) => {
          if (state !== 0) { clear(); return; }
          clear();
          prev.el.style.zIndex = 1; mid.style.zIndex = 2; el.style.zIndex = 3;
          mid.style.display = "block"; fx.style.display = "block";
          tr.render(D ? lt / D : 1);
        }, t0, D);
        this.tl.mark(`${name}`, t0);
        this.pending = null;
        this.t = t0 + D;
      }
      this.tl.add((lt, state, T) => {
        const vis = T >= rec.from && T < rec.to;
        el.style.display = vis ? "block" : "none";
        if (vis) sc.render(T - rec.start, T);
      }, rec.start, 0);
      // scenes are rendered every frame while visible, so register a long span
      this.tl.items[this.tl.items.length - 1].duration = 1e9;
      this.tl.mark(type, rec.start);
      this.cur = rec;
      this.t = Math.max(this.t, rec.start + (sc.duration || 0));
      this.tl.extend(this.t);
      return this;
    }

    transition(name, cfg = {}) { this.pending = { name, cfg }; return this; }
    pause(ms = 400) { this.t += ms; this.tl.extend(this.t); return this; }
    hold(ms = 400) { return this.pause(ms); }

    // ---------------------------------------------------------------- cursor
    get cursorApi() {
      if (!this._cursor) {
        const svg = G3M.svgLayer(this.stage.top, this.stage.W, this.stage.H);
        this._cursor = G3M.Cursor(svg, { x: this.stage.W + 140, y: this.stage.H + 160, scale: 1.2 });
        this.tl.add((lt, st, T) => this._cursor.render(T), 0, 0).duration = 1e9;
      }
      return this._cursor;
    }
    cursor(o = {}) {
      const c = this.cursorApi, dur = o.duration ?? 700;
      const [x, y] = this._toStage(o.x, o.y);
      if (c._hidden) { c.show({ at: this.t }); c._hidden = false; }
      c.move(x, y, { at: this.t, dur, ease: o.ease, bend: o.bend });
      this.t += dur; this.tl.extend(this.t); return this;
    }
    click(o = {}) {
      const c = this.cursorApi; c.click({ at: this.t });
      const [x, y] = c.position(this.t);
      if (this.cur && this.cur.sc.click) this.cur.sc.click(this.t - this.cur.start, x, y);
      this.t += o.hold ?? 320; this.tl.extend(this.t); return this;
    }
    doubleClick(o = {}) {
      const c = this.cursorApi; c.doubleClick({ at: this.t });
      if (this.cur && this.cur.sc.click) this.cur.sc.click(this.t - this.cur.start);
      this.t += o.hold ?? 480; this.tl.extend(this.t); return this;
    }
    drag(from, to, o = {}) {
      const c = this.cursorApi, dur = o.duration ?? 800;
      c.drag(this._toStage(...from), this._toStage(...to), { at: this.t, dur });
      this.t = c.end; this.tl.extend(this.t); return this;
    }
    hideCursor() { this.cursorApi.hide({ at: this.t }); this.cursorApi._hidden = true; return this; }
    showCursor() { this.cursorApi.show({ at: this.t }); this.cursorApi._hidden = false; return this; }

    // Normalised coordinates (0..1) are relative to the current scene's media,
    // if it has any, otherwise to the frame. Larger numbers are stage pixels.
    _toStage(x = .5, y = .5) {
      if (x > 1 || y > 1) return [x, y];
      const m = this.cur && this.cur.sc.media;
      if (m) return m.point(x, y);
      return [x * this.stage.W, y * this.stage.H];
    }

    // ---------------------------------------------------------------- camera
    zoom(o = {}) {
      const sc = this.cur && this.cur.sc;
      if (!sc || !sc.zoom) return this;
      sc.zoom(this.t - this.cur.start, { x: o.x, y: o.y, scale: o.scale ?? 2, duration: o.duration ?? 900,
        dim: o.dim, blur: o.blur, ease: o.ease });
      this.t += o.duration ?? 900; this.tl.extend(this.t); return this;
    }
    zoomTo(o) { return this.zoom(o); }
    zoomReset(o = {}) { return this.zoom({ x: .5, y: .5, scale: 1, duration: o.duration ?? 600, dim: 0, blur: 0 }); }
    spotlight(o) {
      const sc = this.cur && this.cur.sc;
      if (sc && sc.spotlight) sc.spotlight(this.t - this.cur.start, o);
      return this;
    }

    // ---------------------------------------------------------------- overlays
    /* A giant word over the current scene. The footage dims behind it, the
     * word lands, holds, and leaves with its exit. */
    text(str, o = {}) {
      const rec = this.cur; if (!rec) return this;
      const wrap = h("div", {}, rec.el);
      css(wrap, { ...G3M.fill, zIndex: 20, pointerEvents: "none" });
      const dim = h("div", {}, wrap);
      css(dim, { ...G3M.fill, background: G3M.color(o.backdrop || "ink"), opacity: 0 });
      const bt = G3M.BigText(wrap, { text: Array.isArray(str) ? str : String(str).split("|"),
        width: o.width ?? .92, color: o.color || (o.backdrop === "yellow" ? "ink" : "yellow"),
        stretch: o.stretch ?? 70 });
      const t0 = this.t, entrance = o.animation || "slam", hold = o.hold ?? 900, exitDur = 420;
      const n = bt.lines.length, stagger = o.stagger ?? 200;
      const inDur = (entrance === "slam" ? 520 : 560) + (n - 1) * stagger;
      const exitAt = inDur + hold;
      const total = exitAt + (o.exit === "none" ? 0 : exitDur);
      this.tl.add((lt, state, T) => {
        const local = T - t0;
        const on = local >= 0 && T < rec.to && (o.exit === "none" || local <= total);
        wrap.style.display = on ? "block" : "none";
        if (!on) return;
        const dimTo = o.dim ?? .82;
        dim.style.opacity = kf(local, [[0, 0], [160, dimTo, E.outQuad], [exitAt, dimTo], [exitAt + 260, 0, E.inQuad]]);
        G3M.animateText(bt, local, { entrance, stagger, exit: o.exit || "fly", exitAt, rotate: o.rotate });
        const [sx, sy] = entrance === "slam" ? G3M.shake(local, 210, 300, 18, 3) : [0, 0];
        bt.el.style.transform = `translate(${sx}px,${sy}px)`;
      }, t0, 0).duration = 1e9;
      this.t += o.advance ?? total;
      this.tl.extend(this.t);
      return this;
    }

    /* G3 pops into the current scene: "peek" slides up from a corner, looks at
     * the action, blinks, and ducks away. */
    g3(action = "peek", o = {}) {
      const rec = this.cur; if (!rec) return this;
      const svg = G3M.svgLayer(rec.el, this.stage.W, this.stage.H, 25);
      const g3 = G3M.G3(svg);
      const t0 = this.t, dur = o.duration ?? 1600, side = o.side || "left";
      const x = side === "left" ? 190 : this.stage.W - 190, flip = side !== "left";
      this.tl.add((lt, st, T) => {
        const d = T - t0;
        const on = d >= 0 && d <= dur && T < rec.to;
        svg.style.display = on ? "block" : "none";
        if (!on) return;
        const up = kf(d, [[0, 420], [260, -18, E.outCubic], [380, 0, E.outQuad], [dur - 300, 0], [dur, 430, E.inBack(1.6)]]);
        g3.set({ x, y: this.stage.H + 40 + up, scale: 1.25, flip, rot: side === "left" ? 8 : -8,
          lookX: flip ? -1 : 1, lookY: -.35, blink: G3M.g3Life.blink(d, 700),
          eyes: action === "happy" && d > 500 ? "happy" : action === "surprised" ? "wide" : "round",
          antenna: G3M.g3Life.twang(d, 380, 20), armR: action === "point" ? kf(d, [[300, 0], [520, 120, E.pop]]) : 0 });
      }, t0, 0).duration = 1e9;
      if (o.wait !== false) { this.t += o.advance ?? 0; this.tl.extend(t0 + dur); }
      return this;
    }

    // ---------------------------------------------------------------- output
    player(opts) { const p = new G3M.Player(this.tl, opts); p.seek(0); return p; }
  };

  /* Convenience: run a single scene as its own timeline. */
  G3M.single = function (stage, type, cfg) {
    return new G3M.G3Video(stage).scene(type, cfg);
  };

})(window.G3M = window.G3M || {});

<script>/* playground/effects.js */
/* The playground's catalogue. Each effect is a small form (params) plus a
 * function that turns the form into a G3Video script. The script shown in the
 * playground is exactly the script that runs — edit either one. */
(function (G3M) {
  "use strict";

  const J = v => JSON.stringify(v);
  const obj = o => {
    const parts = Object.entries(o).filter(([, v]) => v !== undefined && v !== "")
      .map(([k, v]) => `${k}: ${J(v)}`);
    const one = `{ ${parts.join(", ")} }`;
    return one.length < 72 ? one : `{\n    ${parts.join(",\n    ")}\n  }`;
  };
  const lines = s => String(s).split(/\n|\|/).map(x => x.trim()).filter(Boolean);
  const media = c => c.src && c.src !== "mock" ? { src: c.src, kind: c.kind } : {};

  const P = {
    text: (key, label, def) => ({ key, label, type: "text", def }),
    area: (key, label, def) => ({ key, label, type: "area", def }),
    num: (key, label, def, min = 0, max = 10000, step = 50) => ({ key, label, type: "number", def, min, max, step }),
    pick: (key, label, def, options) => ({ key, label, type: "select", def, options }),
    media: () => ({ key: "src", label: "Footage", type: "media", def: "mock" }),
    bool: (key, label, def) => ({ key, label, type: "bool", def })
  };
  const colors = ["yellow", "ink", "white"];
  const entrances = ["slam", "pop", "drop", "grow", "slide", "whip"];
  const exits = ["none", "fly", "split", "drop", "shrink"];

  const E = [];
  const add = (section, id, title, note, params, script, loop = false) =>
    E.push({ section, id, title, note, params, script, loop });

  // -------------------------------------------------------------- Typography
  add("Typography", "slam", "Slam", "A word hits the frame hard enough to flatten G3. He pops back up.",
    [P.area("text", "Words, one line each", "PARALLEL."), P.pick("entrance", "Entrance", "slam", entrances),
     P.pick("exit", "Exit", "none", exits), P.pick("background", "Background", "yellow", colors),
     P.pick("foreground", "Letters", "ink", colors), P.bool("g3", "G3 gets squashed", true),
     P.num("duration", "Duration (ms)", 2400, 800, 8000)],
    c => `const video = new G3Video(stage)
  .scene("slam", ${obj({ text: lines(c.text), entrance: c.entrance, exit: c.exit === "none" ? undefined : c.exit,
    background: c.background, foreground: c.foreground, g3: c.g3, duration: c.duration })});`);

  add("Typography", "sequence", "Word by word", "Each line lands on the beat. The camera punches in a touch on every word.",
    [P.area("text", "Words, one line each", "SHIP.\nFASTER."), P.pick("entrance", "Entrance", "pop", entrances),
     P.num("beat", "Beat (ms)", 420, 100, 2000, 20), P.pick("exit", "Exit", "split", exits),
     P.pick("background", "Background", "white", colors), P.num("duration", "Duration (ms)", 2400, 800, 8000)],
    c => `const video = new G3Video(stage)
  .scene("sequence", ${obj({ text: lines(c.text), entrance: c.entrance, beat: c.beat,
    exit: c.exit === "none" ? undefined : c.exit, background: c.background, duration: c.duration })});`);

  add("Typography", "hero", "Feature hero", "Headline pops in, G3 hops on from the side and points at it.",
    [P.area("title", "Headline, one line each", "PARALLEL\nTASKS"), P.text("subtitle", "Subtitle pill", "Run five agents at once"),
     P.pick("mascot", "Mascot", "g3", ["g3", "dj", "g2d2", "gb8", "pix"]),
     P.pick("background", "Background", "yellow", colors), P.num("duration", "Duration (ms)", 2600, 1000, 8000)],
    c => `const video = new G3Video(stage)
  .scene("hero", ${obj({ title: lines(c.title), subtitle: c.subtitle, mascot: c.mascot, background: c.background, duration: c.duration })});`);

  add("Typography", "split", "Split letters", "Letters part like curtains to show the footage, then fly off.",
    [P.text("text", "Word", "EVERYWHERE"), P.media(), P.pick("background", "Letter colour", "yellow", ["yellow", "white"]),
     P.num("duration", "Duration (ms)", 2300, 1200, 6000)],
    c => `const video = new G3Video(stage)
  .scene("split", ${obj({ text: c.text, ...media(c), background: c.background, duration: c.duration })});`);

  add("Typography", "overlay", "Word over footage", "Footage plays, freezes under a dim, and a giant word lands on top.",
    [P.text("text", "Word", "EVERYWHERE."), P.media(), P.pick("animation", "Entrance", "slam", entrances),
     P.pick("exit", "Exit", "fly", exits), P.num("hold", "Hold (ms)", 900, 100, 4000)],
    c => `const video = new G3Video(stage)
  .scene("video", ${obj({ ...media(c), treatment: "browser" })})
  .pause(700)
  .text(${J(c.text)}, ${obj({ animation: c.animation, exit: c.exit, hold: c.hold })})
  .pause(300);`);

  // -------------------------------------------------------------- Transitions
  const TR = [
    ["circleExplosion", "Yellow circle explosion", "A dot pops, balloons past the edges, and the next scene grows out of it."],
    ["blackIris", "Black iris", "The frame closes to a pinpoint, holds a beat, then opens on what's next."],
    ["diagonalSlash", "Diagonal slash", "A slanted yellow slab cuts across with a black blade leading."],
    ["verticalPanels", "Vertical panels", "Yellow and black panels slam down in sequence, then drop away."],
    ["wipe", "Rounded wipe", "One thick rounded band sweeps the frame clean."],
    ["wave", "Wave", "A yellow wave rolls across, revealing the next scene behind its crest."],
    ["squash", "Squash", "The scene flattens to a line, the line flashes, the next scene springs open."],
    ["g3Run", "G3 run", "G3 sprints across dragging a giant yellow sheet, and the next scene is behind it."],
    ["g3Push", "G3 haul", "G3 drags the next scene in, struggles, glances at camera, and gets swept away."],
    ["cursorClick", "Cursor click", "A giant cursor clicks, and the click itself becomes the next scene."]
  ];
  for (const [name, title, note] of TR) {
    add("Transitions", "tr-" + name, title, note,
      [P.num("duration", "Duration (ms)", name === "g3Push" ? 1700 : name === "g3Run" ? 1150 : name === "cursorClick" ? 1100 : 900, 300, 3000),
       P.text("from", "Outgoing word", "BEFORE."), P.media()],
      c => `const video = new G3Video(stage)
  .scene("slam", ${obj({ text: [c.from], g3: false, background: "white", duration: 900 })})
  .transition(${J(name)}, ${obj({ duration: c.duration })})
  .scene("video", ${obj({ ...media(c), treatment: "browser", entrance: "none" })})
  .pause(900);`);
  }

  // -------------------------------------------------------------- Video
  add("Video effects", "zoom", "Click and zoom", "Cursor clicks Run, the agents start, the camera dives in, then pulls back.",
    [P.media(), P.pick("treatment", "Frame", "browser", Object.keys(G3M.MEDIA_FRAMES || { browser: 1 })),
     P.num("zoomX", "Zoom target x (0–1)", .55, 0, 1, .01), P.num("zoomY", "Zoom target y (0–1)", .45, 0, 1, .01),
     P.num("scale", "Zoom", 2.2, 1, 5, .1)],
    c => `const video = new G3Video(stage)
  .scene("video", ${obj({ ...media(c), treatment: c.treatment, background: "yellow" })})
  .cursor({ x: .9, y: .09, duration: 800 })
  .click()
  .zoom({ x: ${c.zoomX}, y: ${c.zoomY}, scale: ${c.scale}, duration: 900 })
  .pause(900)
  .zoomReset({ duration: 600 })
  .pause(400);`);

  add("Video effects", "frames", "Media frames", "The same footage in any container: browser, card, circle, tilted, picture-in-picture.",
    [P.media(), P.pick("treatment", "Frame", "tilted", Object.keys(G3M.MEDIA_FRAMES || { browser: 1 })),
     P.pick("entrance", "Entrance", "pop", ["pop", "rise", "none"]), P.pick("background", "Background", "yellow", colors)],
    c => `const video = new G3Video(stage)
  .scene("video", ${obj({ ...media(c), treatment: c.treatment, entrance: c.entrance, background: c.background })})
  .pause(1400);`);

  // -------------------------------------------------------------- Cursor
  add("Cursor", "cursorGag", "Out of the way", "A giant cursor heads straight for G3. He dives aside just in time.",
    [P.media(), P.pick("background", "Background", "yellow", colors), P.num("duration", "Duration (ms)", 4700, 3000, 9000)],
    c => `const video = new G3Video(stage)
  .scene("cursorDemo", ${obj({ ...media(c), background: c.background, duration: c.duration })});`);

  // -------------------------------------------------------------- Typing
  add("Typing", "typing", "Prompt typing", "Types, second-guesses, deletes, retypes, sends. G3 reads along.",
    [P.area("script", "Script, one step per line", "type Fix this issue\npause 420\ndelete issue\ntype entire bloody thing\npause 360\nsubmit"),
     P.text("placeholder", "Placeholder", "Ask g3po to…"), P.num("speed", "Speed (ms per key)", 55, 15, 200, 5),
     P.num("seed", "Rhythm seed", 5, 1, 999, 1)],
    c => {
      const steps = lines(c.script).map(l => {
        const [op, ...rest] = l.split(" "); const arg = rest.join(" ");
        return op === "pause" ? [op, Number(arg)] : op === "submit" ? [op] : [op, arg];
      });
      return `const video = new G3Video(stage)
  .scene("typing", {
    placeholder: ${J(c.placeholder)}, speed: ${c.speed}, seed: ${c.seed},
    script: ${J(steps)}
  });`;
    });

  // -------------------------------------------------------------- Mascots
  add("Mascots", "reactions", "Reaction reel", "Glance, blink, double blink, suspicious tilt, surprise, proud, wave.",
    [P.pick("mascot", "Mascot", "g3", ["g3", "dj"]), P.pick("background", "Background", "yellow", colors)],
    c => `const video = new G3Video(stage)
  .scene("reactions", ${obj({ mascot: c.mascot, background: c.background })});`);

  add("Mascots", "agents", "One becomes many", "Parallel agents: G3 charges, pops, and the crew shoots out. He can't keep track.",
    [P.text("agents", "Crew (comma-separated)", "g2d2, gb8, pix, dj, g3"), P.pick("background", "Background", "yellow", colors)],
    c => `const video = new G3Video(stage)
  .scene("agents", ${obj({ agents: c.agents.split(",").map(s => s.trim()).filter(Boolean), background: c.background })});`);

  add("Mascots", "button", "The button", "G3 presses it. Nothing. He looks at you. Then everything launches.",
    [P.pick("buttonColor", "Button", "red", ["red", "yellow", "ink"]), P.pick("background", "Background", "white", colors)],
    c => `const video = new G3Video(stage)
  .scene("buttonGag", ${obj({ buttonColor: c.buttonColor, background: c.background })});`);

  // -------------------------------------------------------------- UI motion
  add("UI motion", "converge", "Many into one", "Orchestration: scattered tasks converge, snap into one result, and DONE. lands.",
    [P.text("text", "Word", "DONE."), P.num("count", "Tasks", 6, 2, 7, 1), P.pick("background", "Background", "yellow", colors)],
    c => `const video = new G3Video(stage)
  .scene("converge", ${obj({ text: c.text, count: c.count, background: c.background })});`);

  // -------------------------------------------------------------- Logo
  add("Logo ident", "logo", "Ident", "Ribbon flows in, spirals into G3's head, letters snap in. Look left, look right, smile.",
    [P.text("tagline", "Tagline", "Agents for a brighter tomorrow"), P.bool("antenna", "Antenna", true),
     P.pick("background", "Background", "white", colors), P.num("duration", "Duration (ms)", 3600, 3000, 8000)],
    c => `const video = new G3Video(stage)
  .scene("logo", ${obj({ tagline: c.tagline, antenna: c.antenna, background: c.background, duration: c.duration })});`);

  add("Logo ident", "logoLoop", "Ident, looping", "Builds, holds, unwinds back into the ribbon and flows out. Seamless on repeat.",
    [P.bool("antenna", "Antenna", true), P.pick("background", "Background", "white", colors),
     P.num("duration", "Loop length (ms)", 5400, 4600, 9000)],
    c => `const video = new G3Video(stage)
  .scene("logoLoop", ${obj({ antenna: c.antenna, background: c.background, duration: c.duration })});`, true);

  add("Logo ident", "endcard", "End card", "The settled mark with tagline and a call to action.",
    [P.text("tagline", "Tagline", "Agents for a brighter tomorrow"), P.text("cta", "Call to action", "Try g3po"),
     P.pick("background", "Background", "white", colors)],
    c => `const video = new G3Video(stage)
  .scene("endCard", ${obj({ tagline: c.tagline, cta: c.cta, background: c.background })});`);

  // -------------------------------------------------------------- Combined
  add("Combined scenes", "promo", "Promo, 20 seconds", "Hero, explosion, footage, click, zoom, EVERYWHERE., wave, agents, DONE., ident.",
    [P.area("hero", "Hero headline", "MEET\nG3PO"), P.text("slam", "Slam word", "EVERYWHERE."), P.media()],
    c => `const video = new G3Video(stage)
  .scene("hero", ${obj({ title: lines(c.hero), subtitle: "Your agents, your way" })})
  .transition("circleExplosion", { x: 1500, y: 700 })
  .scene("video", ${obj({ ...media(c), treatment: "browser", background: "yellow" })})
  .cursor({ x: .9, y: .09, duration: 700 })
  .click()
  .zoom({ x: .55, y: .45, scale: 2, duration: 800 })
  .g3("peek", { side: "left" })
  .pause(700)
  .zoomReset({ duration: 500 })
  .text(${J(c.slam)}, { animation: "slam", exit: "fly" })
  .transition("wave")
  .scene("agents", {})
  .transition("diagonalSlash")
  .scene("converge", { text: "DONE." })
  .transition("blackIris")
  .scene("logo", { tagline: "Agents for a brighter tomorrow" });`);

  G3M.effects = E;
})(window.G3M = window.G3M || {});

</script>
<script>/* playground/app.js */
/* Motion playground. One stage, one effect at a time, with a scrubber, an
 * editable settings form, and the exact script that produces the frame. */
(function (G3M) {
  "use strict";
  const $ = (sel, root = document) => root.querySelector(sel);
  const h = G3M.h;
  const q = new URLSearchParams(location.search);
  const RENDER = q.get("render") === "1";
  const FORCE_SAFE = q.get("safe") === "1";   // test the eval-free path

  const state = { effect: null, cfg: {}, stage: null, player: null, video: null, code: "" };

  function defaults(effect) {
    const c = {};
    for (const p of effect.params) c[p.key] = p.def;
    return c;
  }

  /* Eval-free fallback. Hosts with a strict content-security policy forbid
   * new Function(), so this reads the script's chain format directly:
   *   const video = new G3Video(stage).scene("x", {...}).pause(300)...;
   * Arguments are JSON with relaxed rules (bare keys, single quotes, .5). */
  function relaxedJSON(src) {
    let out = "", i = 0;
    while (i < src.length) {
      const c = src[i];
      if (c === '"' || c === "'") {
        let j = i + 1, str = "";
        while (j < src.length && src[j] !== c) { if (src[j] === "\\") { str += src[j] + src[j + 1]; j += 2; continue; } str += src[j++]; }
        out += JSON.stringify(c === "'" ? str.replace(/\\'/g, "'") : JSON.parse('"' + str + '"')); i = j + 1; continue;
      }
      out += c; i++;
    }
    out = out.replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":')
             .replace(/([:\[,]\s*)-?\.(\d)/g, (m, a, d) => a + (m.includes("-") ? "-0." : "0.") + d)
             .replace(/,\s*([}\]])/g, "$1");
    return JSON.parse("[" + out + "]");
  }
  G3M.interpretScript = function (code, stage) {
    const body = code.replace(/\/\/.*$/gm, "");
    const start = body.indexOf("new G3Video");
    if (start < 0) throw new Error("The script needs to create `const video = new G3Video(stage)…`.");
    let i = body.indexOf(")", start) + 1;
    const video = new G3M.G3Video(stage);
    while (i < body.length) {
      const m = /^\s*\.\s*([A-Za-z_]\w*)\s*\(/.exec(body.slice(i));
      if (!m) break;
      i += m[0].length;
      let depth = 1, j = i, q = null;
      for (; j < body.length && depth; j++) {
        const c = body[j];
        if (q) { if (c === "\\") j++; else if (c === q) q = null; continue; }
        if (c === '"' || c === "'") q = c;
        else if ("([{".includes(c)) depth++;
        else if (")]}".includes(c)) depth--;
      }
      const args = body.slice(i, j - 1).trim();
      if (typeof video[m[1]] !== "function") throw new Error(`Unknown step .${m[1]}()`);
      video[m[1]](...(args ? relaxedJSON(args) : []));
      i = j;
    }
    return video;
  };

  // ------------------------------------------------------------ build + run
  function run(code) {
    const host = $("#stage");
    if (state.player) state.player.pause();
    if (state.stage) state.stage.destroy();
    state.stage = new G3M.Stage(host, { background: "white" });
    const err = $("#error");
    try {
      let video;
      try {
        if (FORCE_SAFE) throw new EvalError("safe mode");
        const fn = new Function("G3Video", "stage", "G3M", code + "\n;return typeof video !== 'undefined' ? video : null;");
        video = fn(G3M.G3Video, state.stage, G3M);
      } catch (e) {
        // blocked by the page's security policy: read the script instead
        if (!(e instanceof EvalError) && !/unsafe-eval|Content Security/i.test(e.message)) throw e;
        video = G3M.interpretScript(code, state.stage);
      }
      if (!video) throw new Error("The script needs to create `const video = new G3Video(stage)…`.");
      state.video = video;
      state.player = new G3M.Player(video.timeline(), { loop: !!state.effect.loop || $("#loop").checked });
      state.player.on(onTime);
      state.player.seek(0);
      window.g3Duration = video.duration;
      window.g3Seek = t => { state.player.pause(); state.player.seek(t); return t; };
      err.hidden = true;
      const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!RENDER && !reduce) state.player.play();
    } catch (e) {
      err.hidden = false;
      err.textContent = "Script error: " + e.message;
    }
  }

  function onTime(t, player) {
    const d = player.tl.duration || 1;
    const scrub = $("#scrub");
    if (document.activeElement !== scrub) scrub.value = String(t / d * 1000);
    $("#time").textContent = `${(t / 1000).toFixed(2)} s / ${(d / 1000).toFixed(2)} s`;
    const btn = $("#play");
    btn.textContent = player.playing ? "Pause" : "Play";
    btn.setAttribute("aria-pressed", player.playing ? "true" : "false");
  }

  function select(effect, keepCfg) {
    state.effect = effect;
    state.cfg = keepCfg ? state.cfg : defaults(effect);
    document.querySelectorAll(".rail button").forEach(b => b.classList.toggle("on", b.dataset.id === effect.id));
    $("#title").textContent = effect.title;
    $("#note").textContent = effect.note;
    $("#loop").checked = !!effect.loop;
    buildForm();
    regenerate();
    if (!RENDER) history.replaceState(null, "", "?effect=" + effect.id);
  }

  function regenerate() {
    state.code = state.effect.script(state.cfg);
    $("#code").value = state.code;
    run(state.code);
  }

  // ------------------------------------------------------------ form
  function buildForm() {
    const form = $("#form");
    form.innerHTML = "";
    for (const p of state.effect.params) {
      const row = h("label", { class: "field" }, form);
      h("span", { text: p.label }, row);
      let input;
      if (p.type === "area") {
        input = h("textarea", { rows: 3 }, row); input.value = state.cfg[p.key];
      } else if (p.type === "select") {
        input = h("select", {}, row);
        for (const o of p.options) { const op = h("option", { value: o, text: o }, input); if (o === state.cfg[p.key]) op.selected = true; }
      } else if (p.type === "number") {
        input = h("input", { type: "number", min: p.min, max: p.max, step: p.step }, row); input.value = state.cfg[p.key];
      } else if (p.type === "bool") {
        row.classList.add("check");
        input = h("input", { type: "checkbox" }, row); input.checked = !!state.cfg[p.key];
        row.insertBefore(input, row.firstChild);
      } else if (p.type === "media") {
        const wrap = h("div", { class: "media" }, row);
        const file = h("input", { type: "file", accept: "video/*,image/*", "aria-label": "Choose footage" }, wrap);
        const reset = h("button", { type: "button", class: "ghost", text: "Use stand-in app" }, wrap);
        const name = h("span", { class: "hint", text: state.cfg.src === "mock" ? "Showing the stand-in g3po app" : "Your footage" }, row);
        file.addEventListener("change", () => {
          const f = file.files && file.files[0]; if (!f) return;
          state.cfg.src = URL.createObjectURL(f);
          state.cfg.kind = f.type.startsWith("video") ? "video" : "image";
          name.textContent = f.name; regenerate();
        });
        reset.addEventListener("click", () => { state.cfg.src = "mock"; delete state.cfg.kind; name.textContent = "Showing the stand-in g3po app"; regenerate(); });
        continue;
      } else {
        input = h("input", { type: "text" }, row); input.value = state.cfg[p.key];
      }
      const commit = () => {
        state.cfg[p.key] = p.type === "number" ? Number(input.value) : p.type === "bool" ? input.checked : input.value;
        regenerate();
      };
      input.addEventListener(p.type === "text" || p.type === "area" ? "change" : "input", commit);
      if (p.type === "text") input.addEventListener("keydown", e => { if (e.key === "Enter") commit(); });
    }
  }

  // ------------------------------------------------------------ rail
  function buildRail() {
    const rail = $("#rail");
    let section = null, group = null;
    for (const e of G3M.effects) {
      if (e.section !== section) {
        section = e.section;
        const sec = h("div", { class: "group" }, rail);
        h("h3", { text: section }, sec);
        group = h("div", { class: "items" }, sec);
      }
      const b = h("button", { type: "button", "data-id": e.id, text: e.title }, group);
      b.addEventListener("click", () => select(e));
    }
  }

  // ------------------------------------------------------------ transport
  function wire() {
    $("#play").addEventListener("click", () => state.player && state.player.toggle());
    $("#replay").addEventListener("click", () => state.player && state.player.replay());
    $("#back").addEventListener("click", () => { if (!state.player) return; state.player.pause(); state.player.seek(state.player.t - 1000 / 60); });
    $("#fwd").addEventListener("click", () => { if (!state.player) return; state.player.pause(); state.player.seek(state.player.t + 1000 / 60); });
    const scrub = $("#scrub");
    scrub.addEventListener("input", () => {
      if (!state.player) return;
      state.player.pause(); state.player.seek(Number(scrub.value) / 1000 * state.player.tl.duration);
    });
    $("#speed").addEventListener("change", e => { if (state.player) state.player.rate = Number(e.target.value); });
    $("#loop").addEventListener("change", e => { if (state.player) state.player.loop = e.target.checked; });
    $("#runCode").addEventListener("click", () => run($("#code").value));
    $("#resetCode").addEventListener("click", () => regenerate());
    $("#copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText($("#code").value); $("#copy").textContent = "Copied"; }
      catch (e) { $("#code").select(); $("#copy").textContent = "Selected"; }
      setTimeout(() => $("#copy").textContent = "Copy", 1400);
    });
    document.addEventListener("keydown", e => {
      if (/input|textarea|select/i.test(document.activeElement.tagName)) return;
      if (e.code === "Space") { e.preventDefault(); state.player && state.player.toggle(); }
      if (e.key === "ArrowLeft") $("#back").click();
      if (e.key === "ArrowRight") $("#fwd").click();
      if (e.key === "r") $("#replay").click();
    });
  }

  function start() {
    if (RENDER) document.body.classList.add("render");
    buildRail();
    wire();
    const want = q.get("effect");
    const e = G3M.effects.find(x => x.id === want) || G3M.effects[0];
    select(e);
  }

  const ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([ready, new Promise(r => setTimeout(r, 1500))]).then(start);
})(window.G3M = window.G3M || {});

</script>
</body>
</html>
