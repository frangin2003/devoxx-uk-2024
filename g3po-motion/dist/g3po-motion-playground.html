<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>g3po motion playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1C1D1F; --ink-2: #26282B; --ink-3: #34373B; --line: #3C3F44;
    --yellow: #FFC400; --white: #F7F3EA; --mute: #A8ABB0;
    --font: 'Archivo', 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; background: var(--ink); color: var(--white); font-family: var(--font); font-size: 15px;
         line-height: 1.45; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 14px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
  header .mark { width: 44px; height: 32px; flex: none; }
  header h1 { margin: 0; font-size: 22px; font-weight: 900; font-stretch: 88%; letter-spacing: -.01em; }
  header p { margin: 0 0 0 auto; color: var(--mute); font-size: 13px; }

  .shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 65px); }
  .rail { border-right: 1px solid var(--line); padding: 18px 14px 40px; overflow-y: auto; max-height: calc(100vh - 65px);
          position: sticky; top: 0; }
  .rail h3 { margin: 18px 10px 8px; font-size: 13px; font-weight: 700; color: var(--mute); }
  .rail .group:first-child h3 { margin-top: 2px; }
  .rail .items { display: flex; flex-direction: column; gap: 2px; }
  .rail button { text-align: left; border: 0; background: transparent; padding: 8px 12px; border-radius: 20px;
                 cursor: pointer; font-weight: 600; font-size: 15px; }
  .rail button:hover { background: var(--ink-2); }
  .rail button.on { background: var(--yellow); color: var(--ink); font-weight: 800; }

  main { padding: 22px 28px 60px; min-width: 0; }
  .head { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; }
  .head h2 { margin: 0; font-size: 40px; line-height: 1; font-weight: 900; font-stretch: 72%; letter-spacing: -.015em; }
  .head p { margin: 0; color: var(--mute); max-width: 62ch; }

  .stagewrap { border-radius: 18px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 100%; }

  .transport { display: flex; align-items: center; gap: 8px; margin: 14px 0 22px; flex-wrap: wrap; }
  .transport button, .panel button { border: 1px solid var(--line); background: var(--ink-2); padding: 9px 16px;
    border-radius: 22px; cursor: pointer; font-weight: 700; }
  .transport button:hover, .panel button:hover { border-color: var(--mute); }
  #play { background: var(--yellow); color: var(--ink); border-color: var(--yellow); min-width: 86px; }
  .transport .step { padding: 9px 12px; min-width: 42px; }
  #scrub { flex: 1 1 200px; accent-color: var(--yellow); min-width: 140px; }
  #time { font-variant-numeric: tabular-nums; color: var(--mute); min-width: 120px; text-align: right; font-size: 14px; }
  .transport select { background: var(--ink-2); border: 1px solid var(--line); border-radius: 22px; padding: 8px 12px; }
  .transport label { display: flex; align-items: center; gap: 6px; color: var(--mute); font-size: 14px; }

  .panels { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 20px; }
  .panel { background: var(--ink-2); border-radius: 16px; padding: 18px 20px 20px; min-width: 0; }
  .panel h4 { margin: 0 0 12px; font-size: 17px; font-weight: 800; }
  .panel .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  #runCode { background: var(--yellow); color: var(--ink); border-color: var(--yellow); }

  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .field > span { font-size: 13px; color: var(--mute); font-weight: 600; }
  .field input[type=text], .field input[type=number], .field select, .field textarea {
    width: 100%; background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
  .field textarea { resize: vertical; min-height: 64px; }
  .field.check { grid-template-columns: auto 1fr; align-items: center; }
  .field.check input { width: 18px; height: 18px; accent-color: var(--yellow); }
  .field .media { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .field .media input { font-size: 13px; max-width: 100%; }
  .field .hint { font-size: 12px; color: var(--mute); }
  .ghost { border: 1px solid var(--line); background: transparent; border-radius: 20px; padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 700; }

  #code { width: 100%; min-height: 300px; background: var(--ink); color: #E9E4D6; border: 1px solid var(--line);
          border-radius: 12px; padding: 14px 16px; font-family: var(--mono); font-size: 13px; line-height: 1.55;
          resize: vertical; white-space: pre; overflow: auto; tab-size: 2; }
  #error { margin-top: 12px; background: #3A1E1A; color: #FFC9BF; border-radius: 10px; padding: 10px 14px; font-size: 14px; }

  @media (max-width: 980px) {
    .shell { grid-template-columns: 1fr; }
    .rail { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line);
            display: flex; gap: 14px; overflow-x: auto; padding: 12px 14px; }
    .rail .group { flex: none; }
    .rail h3 { margin: 0 6px 6px; }
    .rail .items { flex-direction: row; }
    .rail button { white-space: nowrap; }
    main { padding: 16px 14px 48px; }
    .head h2 { font-size: 32px; }
    .panels { grid-template-columns: 1fr; }
    header p { display: none; }
  }

  /* render mode: only the stage, at native size, for frame export */
  body.render { background: #000; }
  body.render header, body.render .rail, body.render .head, body.render .transport,
  body.render .panels { display: none; }
  body.render .shell { display: block; min-height: 0; }
  body.render main { padding: 0; }
  body.render .stagewrap { width: 1920px; border-radius: 0; }
</style>
</head>
<body>
<header>
  <svg class="mark" viewBox="0 0 88 64" aria-hidden="true">
    <rect x="3" y="3" width="82" height="58" rx="27" fill="#FFC400" stroke="#F7F3EA" stroke-width="0"/>
    <circle cx="30" cy="31" r="10" fill="#1C1D1F"/><circle cx="58" cy="31" r="10" fill="#1C1D1F"/>
    <circle cx="27" cy="28" r="3.4" fill="#fff"/><circle cx="55" cy="28" r="3.4" fill="#fff"/>
  </svg>
  <h1>g3po motion playground</h1>
  <p>Space plays, arrows step one frame, R replays</p>
</header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Effects"></nav>
  <main>
    <div class="head"><h2 id="title"></h2><p id="note"></p></div>
    <div class="stagewrap"><div id="stage"></div></div>
    <div class="transport" role="group" aria-label="Playback">
      <button id="play" type="button">Play</button>
      <button id="replay" type="button">Replay</button>
      <button id="back" class="step" type="button" aria-label="Back one frame">&#8249;</button>
      <button id="fwd" class="step" type="button" aria-label="Forward one frame">&#8250;</button>
      <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Scrub">
      <span id="time">0.00 s</span>
      <select id="speed" aria-label="Speed">
        <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option>
      </select>
      <label><input id="loop" type="checkbox"> Loop</label>
    </div>
    <div class="panels">
      <section class="panel">
        <h4>Settings</h4>
        <form id="form" onsubmit="return false"></form>
      </section>
      <section class="panel">
        <h4>Script</h4>
        <textarea id="code" spellcheck="false" aria-label="G3Video script"></textarea>
        <div class="row">
          <button id="runCode" type="button">Run script</button>
          <button id="resetCode" type="button">Reset to settings</button>
          <button id="copy" type="button">Copy</button>
        </div>
        <div id="error" hidden></div>
      </section>
    </div>
  </main>
</div>

<!-- the toolkit -->
<script>/* motion/core.js */
/* g3po motion — core
 *
 * Every animation in this toolkit is a pure function of time. Nothing relies on
 * wall-clock CSS animations: a Timeline renders the exact state for any t, so a
 * frame can be reproduced by seeking. That is what makes export deterministic
 * and the playground scrubber frame-accurate.
 */
(function (G3M) {
  "use strict";

  // ------------------------------------------------------------------ palette
  G3M.C = {
    yellow: "#FFC400", yellowDeep: "#E6AA00", ink: "#1C1D1F", white: "#F7F3EA",
    cheek: "#F2994A", red: "#E0452B", grey: "#C9CCD0", steel: "#8C959E",
    blue: "#2F6FB5", green: "#3FA66B", paper: "#FFFDF7"
  };
  G3M.FONT = "'Archivo', 'Archivo Black', 'Arial Black', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif";

  // Accept palette names or raw colours anywhere a colour is configured.
  G3M.color = function (c) { return (c && G3M.C[c]) || c || G3M.C.yellow; };

  // ------------------------------------------------------------------ maths
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const prog = (t, start, dur) => dur <= 0 ? (t >= start ? 1 : 0) : clamp((t - start) / dur);
  G3M.clamp = clamp; G3M.lerp = lerp; G3M.prog = prog;

  // ------------------------------------------------------------------ easing
  const E = {
    linear: t => t,
    inQuad: t => t * t,
    outQuad: t => 1 - (1 - t) * (1 - t),
    inOutQuad: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
    inCubic: t => t * t * t,
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    outQuint: t => 1 - Math.pow(1 - t, 5),
    inExpo: t => t === 0 ? 0 : Math.pow(2, 10 * t - 10),
    outExpo: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
    inOutExpo: t => t === 0 ? 0 : t === 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
    outBack: (s = 1.70158) => t => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2),
    inBack: (s = 1.70158) => t => (s + 1) * t * t * t - s * t * t,
    // damped oscillation that settles exactly on 1
    spring: (bounces = 2.2, damping = 5.5) => t =>
      t >= 1 ? 1 : 1 - Math.exp(-damping * t) * Math.cos(bounces * Math.PI * t) * (1 - t * 0.02)
  };
  // Named presets: the house personality.
  E.pop = E.outBack(2.4);          // ~12% overshoot
  E.snap = E.outQuint;
  E.whip = E.inOutExpo;
  E.bouncy = E.spring(2.4, 5);
  E.settle = E.spring(1.6, 6.5);
  G3M.ease = E;
  G3M.easing = function (name) {
    if (typeof name === "function") return name;
    if (!name) return E.snap;
    const e = E[name];
    if (typeof e === "function" && e.length === 0 && (name === "outBack" || name === "inBack" || name === "spring"))
      return e();
    return e || E.snap;
  };

  /* Keyframes: kf(t, [[time, value, ease], ...]). The ease on a frame shapes the
   * segment arriving at it. Values can be numbers or arrays of numbers. Easing
   * curves are allowed to overshoot (outBack, spring) and values extrapolate. */
  function mix(a, b, t) {
    if (Array.isArray(a)) return a.map((v, i) => lerp(v, b[i], t));
    return lerp(a, b, t);
  }
  G3M.kf = function (t, frames) {
    if (t <= frames[0][0]) return frames[0][1];
    for (let i = 1; i < frames.length; i++) {
      const f = frames[i];
      if (t <= f[0]) {
        const a = frames[i - 1];
        const p = (t - a[0]) / ((f[0] - a[0]) || 1);
        return mix(a[1], f[1], (f[2] || E.linear)(clamp(p)));
      }
    }
    return frames[frames.length - 1][1];
  };

  // Seeded randomness so jitter (typing speed, confetti, shake) is repeatable.
  G3M.rng = function (seed = 1) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  };

  // Decaying shake, deterministic for a given seed.
  G3M.shake = function (t, t0, dur, amp, seed = 7) {
    const p = (t - t0) / dur;
    if (p < 0 || p > 1) return [0, 0];
    const d = Math.pow(1 - p, 2) * amp;
    const k = Math.floor((t - t0) / 16);
    const r = G3M.rng(seed * 997 + k);
    return [(r() * 2 - 1) * d, (r() * 2 - 1) * d];
  };

  // Quadratic bezier with a bend, for curved motion paths.
  G3M.curve = function (a, b, t, bend = 0.18) {
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const cx = mx - dy * bend, cy = my + dx * bend;
    const u = 1 - t;
    return [u * u * a[0] + 2 * u * t * cx + t * t * b[0],
            u * u * a[1] + 2 * u * t * cy + t * t * b[1]];
  };

  // ------------------------------------------------------------------ DOM
  const SVGNS = "http://www.w3.org/2000/svg";
  G3M.h = function (tag, props, parent) {
    const el = document.createElement(tag);
    if (props) for (const k in props) {
      if (k === "style" && typeof props[k] === "object") Object.assign(el.style, props[k]);
      else if (k === "text") el.textContent = props[k];
      else if (k === "html") el.innerHTML = props[k];
      else el.setAttribute(k, props[k]);
    }
    if (parent) parent.appendChild(el);
    return el;
  };
  G3M.s = function (tag, attrs, parent) {
    const el = document.createElementNS(SVGNS, tag);
    if (attrs) for (const k in attrs) {
      if (k === "text") el.textContent = attrs[k]; else el.setAttribute(k, attrs[k]);
    }
    if (parent) parent.appendChild(el);
    return el;
  };
  G3M.set = function (el, attrs) { for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };
  G3M.css = function (el, style) { Object.assign(el.style, style); return el; };

  /* Text width at a given size, measured in an off-screen probe. Scenes are
   * built while hidden (display: none), where layout reports zero, so any
   * measuring has to happen outside them. */
  let probe = null;
  G3M.measureText = function (text, style = {}) {
    if (!probe) {
      probe = document.createElement("span");
      Object.assign(probe.style, { position: "absolute", left: "-99999px", top: "0", visibility: "hidden",
        whiteSpace: "pre", pointerEvents: "none" });
      document.body.appendChild(probe);
    }
    Object.assign(probe.style, { fontFamily: G3M.FONT, fontWeight: 900, fontStretch: "100%", fontSize: "100px",
      letterSpacing: "0", textTransform: "none" }, style);
    probe.textContent = text;
    return probe.getBoundingClientRect().width;
  };

  // Full-frame layer helpers
  G3M.fill = { position: "absolute", left: "0", top: "0", width: "100%", height: "100%" };
  G3M.svgLayer = function (parent, W, H, z) {
    const svg = G3M.s("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H }, parent);
    Object.assign(svg.style, G3M.fill, { overflow: "visible", pointerEvents: "none" });
    if (z != null) svg.style.zIndex = z;
    return svg;
  };

  // ------------------------------------------------------------------ Stage
  /* A 1920x1080 (configurable) frame, scaled to fit its host. All scene
   * coordinates are in stage pixels regardless of the display size. */
  G3M.Stage = class Stage {
    constructor(host, opts = {}) {
      this.W = opts.width || 1920;
      this.H = opts.height || 1080;
      this.host = host;
      host.innerHTML = "";
      host.style.position = host.style.position || "relative";
      this.root = G3M.h("div", { class: "g3-stage" }, host);
      G3M.css(this.root, {
        position: "absolute", left: "0", top: "0", width: this.W + "px", height: this.H + "px",
        overflow: "hidden", transformOrigin: "0 0", background: G3M.color(opts.background || "white"),
        fontFamily: G3M.FONT, contain: "strict"
      });
      this.scenes = G3M.h("div", {}, this.root); G3M.css(this.scenes, G3M.fill);
      this.fx = G3M.h("div", {}, this.root);     G3M.css(this.fx, G3M.fill); this.fx.style.zIndex = 50;
      this.top = G3M.h("div", {}, this.root);    G3M.css(this.top, G3M.fill); this.top.style.zIndex = 90;
      this.fit();
      if (window.ResizeObserver) {
        this._ro = new ResizeObserver(() => this.fit());
        this._ro.observe(host);
      }
    }
    fit() {
      const w = this.host.clientWidth || this.W;
      const s = w / this.W;
      this.scale = s;
      this.root.style.transform = `scale(${s})`;
      this.host.style.height = (this.H * s) + "px";
    }
    destroy() { if (this._ro) this._ro.disconnect(); this.host.innerHTML = ""; }
  };

  // ------------------------------------------------------------------ Timeline
  /* Items are renderers placed on a time axis. render(lt, state, t) receives the
   * local time clamped to the item, a state (-1 before, 0 during, 1 after) and
   * the global time. Items hold their first frame before they start and their
   * last frame after they end, so seeking anywhere gives a coherent picture. */
  G3M.Timeline = class Timeline {
    constructor() { this.items = []; this.duration = 0; this.markers = []; }
    add(render, start = 0, duration = 0, opts = {}) {
      const it = { render, start, duration, z: opts.z || 0 };
      this.items.push(it);
      this.duration = Math.max(this.duration, start + duration);
      return it;
    }
    mark(label, t) { this.markers.push({ label, t }); }
    extend(t) { this.duration = Math.max(this.duration, t); }
    /* Two passes: items outside their span first (holds, resets), then the
     * active ones. An idle transition resetting a scene's styles must never
     * run after an active transition has just set them. */
    render(t) {
      const active = [];
      for (const it of this.items) {
        const lt = t - it.start;
        const state = lt < 0 ? -1 : lt > it.duration ? 1 : 0;
        if (state === 0) active.push([it, lt]);
        else it.render(clamp(lt, 0, it.duration), state, t);
      }
      for (const [it, lt] of active) it.render(clamp(lt, 0, it.duration), 0, t);
    }
  };

  // ------------------------------------------------------------------ Player
  G3M.Player = class Player {
    constructor(timeline, opts = {}) {
      this.tl = timeline; this.t = 0; this.playing = false;
      this.rate = 1; this.loop = !!opts.loop; this.listeners = [];
      this._tick = this._tick.bind(this);
    }
    on(fn) { this.listeners.push(fn); return this; }
    play() {
      if (this.t >= this.tl.duration) this.t = 0;
      this.playing = true; this._last = performance.now();
      requestAnimationFrame(this._tick); this._emit();
    }
    pause() { this.playing = false; this._emit(); }
    toggle() { this.playing ? this.pause() : this.play(); }
    replay() { this.t = 0; this.render(); this.play(); }
    seek(t) { this.t = clamp(t, 0, this.tl.duration); this.render(); }
    render() { this.tl.render(this.t); this._emit(); }
    _emit() { for (const f of this.listeners) f(this.t, this); }
    _tick(now) {
      if (!this.playing) return;
      const dt = Math.min(100, now - this._last); this._last = now;
      this.t += dt * this.rate;
      if (this.t >= this.tl.duration) {
        if (this.loop && this.tl.duration > 0) this.t %= this.tl.duration;
        else { this.t = this.tl.duration; this.playing = false; }
      }
      this.render();
      if (this.playing) requestAnimationFrame(this._tick);
    }
  };

  /* Deterministic frame export. In a headless browser:
   *   G3M.frameTimes(fps) -> [0, 16.67, ...]; call window.g3Seek(t) per frame
   * then screenshot. tools/render.py does exactly this. */
  G3M.frameTimes = function (duration, fps = 60) {
    const n = Math.ceil(duration / 1000 * fps) + 1, out = [];
    for (let i = 0; i < n; i++) out.push(Math.min(duration, i * 1000 / fps));
    return out;
  };

})(window.G3M = window.G3M || {});

</script>
<script>/* motion/text.js */
/* Kinetic typography.
 *
 * BigText builds giant display text fitted to the frame, split into lines and
 * letters so any entrance can address either. Entrances and exits are pure
 * functions of time returning a transform, so they compose with anything.
 *
 * Copy always comes from configuration. Nothing in here knows a word of it.
 */
(function (G3M) {
  "use strict";
  const { h, css, kf, ease: E, clamp } = G3M;

  G3M.BigText = function BigText(parent, cfg = {}) {
    const lines = Array.isArray(cfg.text) ? cfg.text : String(cfg.text || "").split("\n");
    const W = cfg.stageW || 1920, H = cfg.stageH || 1080;
    const wrap = h("div", {}, parent);
    css(wrap, { position: "absolute", left: "0", top: "0", width: W + "px", height: H + "px",
      display: "flex", flexDirection: "column", justifyContent: "center",
      alignItems: cfg.align === "left" ? "flex-start" : cfg.align === "right" ? "flex-end" : "center",
      padding: cfg.align === "center" || !cfg.align ? "0" : "0 80px", boxSizing: "border-box",
      pointerEvents: "none" });
    const lineEls = [], letters = [];
    for (const text of lines) {
      const line = h("div", {}, wrap);
      css(line, { fontFamily: G3M.FONT, fontWeight: 900, fontStretch: (cfg.stretch ?? 72) + "%",
        color: G3M.color(cfg.color || "ink"), lineHeight: String(cfg.leading ?? .84),
        whiteSpace: "nowrap", letterSpacing: (cfg.tracking ?? -0.02) + "em",
        textTransform: cfg.uppercase === false ? "none" : "uppercase",
        willChange: "transform", transformOrigin: "50% 60%" });
      const ls = [];
      for (const ch of text) {
        const sp = h("span", { text: ch === " " ? "\u00a0" : ch }, line);
        css(sp, { display: "inline-block", willChange: "transform" });

  /* Entrances. Each returns {x, y, sx, sy, rot, op} for local time t (ms)
   * since the element started entering. `rest` is the resting rotation. */
  const IN = {

    drop(t, rest = 0) {

    },
    slide(t, rest = 0, dir = -1) {

      const skew = kf(t, [[0, 0], [200, -dir * 14], [460, 0, E.outQuad]]);

    },
    whip(t, rest = -8) {

      return { x, y: 0, sx: kf(t, [[0, 1.5], [300, .96, E.outExpo], [480, 1, E.outQuad]]), sy: 1,
        rot: rest, op: 1, skew: kf(t, [[0, -24], [300, 6, E.outExpo], [480, 0, E.outQuad]]) };

    fly(t) {       // rushes past the camera

    drop(t) {
      const p = E.inBack(1.6)(clamp(t / 420));
      return { y: p * 1400, x: 0, sx: 1, sy: 1, rot: p * 8, op: 1 };
    },
    split(t, i, n) { // lines part vertically
      const dir = i < (n - 1) / 2 ? -1 : i > (n - 1) / 2 ? 1 : (i % 2 ? 1 : -1);
      const p = E.inBack(1.4)(clamp(t / 420));
      return { y: dir * p * 1200, x: 0, sx: 1, sy: 1, rot: 0, op: 1 };

    shrink(t) {

      return { sx: sc, sy: sc, op: 1, x: 0, y: 0, rot: 0 };
    },
    none() { return { x: 0, y: 0, sx: 1, sy: 1, rot: 0, op: 1 }; }
  };
  G3M.textIn = IN; G3M.textOut = OUT;

  G3M.applyTransform = function (el, f, baseRot = 0) {
    el.style.transform =
      `translate(${f.x || 0}px,${f.y || 0}px) rotate(${f.rot ?? baseRot}deg) ` +
      `skewX(${f.skew || 0}deg) scale(${f.sx ?? 1},${f.sy ?? 1})`;
    el.style.opacity = f.op ?? 1;
  };

  /* Drive a BigText through entrance -> hold -> exit.
   * cfg: entrance, exit, stagger (ms between lines), holdUntil (ms), rest rotation */
  G3M.animateText = function (bt, t, cfg = {}) {

<script>/* motion/cursor.js */
/* Giant cursor overlay.
 *
 * Deliberately oversized and graphic. Build a script of moves and clicks, then
 * render(t). Moves follow a bent path rather than a straight robotic line.
 *
 *   const cur = G3M.Cursor(svgLayer, { x: 1500, y: 900 });
 *   cur.move(1200, 620, { at: 200, dur: 700 });
 *   cur.click({ at: 950 });
 *   cur.drag([1200,620], [600,400], { at: 1400, dur: 800 });
 *   cur.render(t);
 */

  "use strict";
  const { s, set, C, kf, ease: E, clamp } = G3M;
  const ARROW = "M0,0 L0,118 L30,90 L52,138 L76,127 L54,80 L94,80 Z";

  G3M.Cursor = function Cursor(parent, opts = {}) {

    const fx = s("g", {}, root);
    const hand = s("g", {}, root);
    const scaleBase = opts.scale ?? 1;
    s("path", { d: ARROW, fill: G3M.color(opts.fill || "ink"), stroke: G3M.color(opts.stroke || "#FFFFFF"),
      "stroke-width": 9, "stroke-linejoin": "round", "paint-order": "stroke" }, hand);

    const moves = [], clicks = [], vis = [];
    let x0 = opts.x ?? 1600, y0 = opts.y ?? 900, cursorT = 0, lastX = x0, lastY = y0;

    const api = {
      el: root,
      get end() { return cursorT; },
      move(x, y, o = {}) {
        const at = o.at ?? cursorT, dur = o.dur ?? 650;

          ease: G3M.easing(o.ease || "inOutCubic") });

      },
      click(o = {}) {
        const at = o.at ?? cursorT;
        clicks.push({ at, x: lastX, y: lastY, style: o.style || "ring" });
        cursorT = at + (o.hold ?? 260); return api;
      },
      doubleClick(o = {}) {
        const at = o.at ?? cursorT;
        api.click({ at, hold: 130 }); api.click({ at: at + 150, hold: o.hold ?? 280 });
        return api;
      },
      drag(from, to, o = {}) {
        const at = o.at ?? cursorT;
        api.move(from[0], from[1], { at, dur: o.approach ?? 350 });
        clicks.push({ at: at + (o.approach ?? 350), x: from[0], y: from[1], style: "press", release: (o.dur ?? 700) });
        api.move(to[0], to[1], { at: at + (o.approach ?? 350) + 80, dur: o.dur ?? 700, bend: .08 });
        clicks.push({ at: cursorT, x: to[0], y: to[1], style: "ring" });

      hide(o = {}) { vis.push({ at: o.at ?? cursorT, on: false }); return api; },
      show(o = {}) { vis.push({ at: o.at ?? cursorT, on: true }); return api; },
      wait(ms) { cursorT += ms; return api; },

      position(t) {
        let p = [x0, y0];
        for (const m of moves) {
          if (t < m.at) break;
          const k = m.ease(clamp((t - m.at) / m.dur));
          p = G3M.curve(m.from, m.to, k, m.bend);
        }
        return p;
      },
      render(t) {
        let on = opts.visible ?? true;
        for (const v of vis) if (t >= v.at) on = v.on;
        const [x, y] = api.position(t);
        // press squash from the nearest click
        let press = 0;
        for (const c of clicks) {
          const d = t - c.at;
          if (c.style === "press" && d >= 0 && d <= (c.release || 0) + 80) press = Math.max(press, .16);
          else if (d >= 0 && d < 220) press = Math.max(press, kf(d, [[0, 0], [60, .2, E.outQuad], [220, 0, E.pop]]));
        }
        // lean into motion: a slight tilt while moving fast
        const [px, py] = api.position(t - 16);
        const vx = x - px;
        const tilt = clamp(vx * .25, -10, 10);
        set(hand, { transform: `translate(${x},${y}) rotate(${-8 + tilt}) scale(${scaleBase * (1 + press * .4)},${scaleBase * (1 - press)})` });
        set(root, { opacity: on ? 1 : 0 });

        // click effects
        fx.innerHTML = "";
        for (const c of clicks) {
          const d = t - c.at;
          if (d < 0 || d > 700 || c.style === "press") continue;
          const p = clamp(d / 520);
          const r = 18 + E.outCubic(p) * 150 * scaleBase;
          s("circle", { cx: c.x, cy: c.y, r, fill: "none", stroke: C.yellow,
            "stroke-width": 26 * (1 - p) + 2, opacity: 1 - p }, fx);
          const r2 = 10 + E.outExpo(clamp(d / 380)) * 90 * scaleBase;
          s("circle", { cx: c.x, cy: c.y, r: r2, fill: "none", stroke: C.ink,
            "stroke-width": 6, opacity: 1 - clamp(d / 380) }, fx);

              stroke: C.ink, "stroke-width": 9, "stroke-linecap": "round", opacity: 1 - q }, fx);
          }
        }
      }
    };
    return api;
  };

</script>
<script>/* motion/typing.js */
/* Typing system.
 *
 * A script of operations compiles to a list of timed text states, so render(t)
 * is exact and deterministic: jitter comes from a seeded generator.
 *
 *   const box = G3M.TypeBox(parent, { x: 360, y: 700, width: 1200 });
 *   box.type("Fix this issue").pause(400).delete("issue")
 *      .type("entire bloody thing").pause(300).submit();
 *   box.render(t);
 */
(function (G3M) {
  "use strict";
  const { h, css, kf, ease: E, clamp, C } = G3M;

  G3M.TypeBox = function TypeBox(parent, cfg = {}) {
    const W = cfg.width ?? 1180, x = cfg.x ?? (1920 - W) / 2, y = cfg.y ?? 700;
    const speed = cfg.speed ?? 52;          // ms per character, before jitter
    const jitter = cfg.jitter ?? .45;       // 0 = metronomic
    const rnd = G3M.rng(cfg.seed ?? 3);

    const box = h("div", {}, parent);
    css(box, { position: "absolute", left: x + "px", top: y + "px", width: W + "px", height: "150px",
      background: G3M.color(cfg.fill || "#FFFFFF"), borderRadius: "75px", border: `8px solid ${C.ink}`,
      boxSizing: "border-box", display: "flex", alignItems: "center", padding: "0 150px 0 64px",
      fontFamily: G3M.FONT, fontWeight: 700, fontSize: "58px", color: C.ink, transformOrigin: "50% 50%",
      willChange: "transform" });
    const textEl = h("span", {}, box);
    css(textEl, { whiteSpace: "pre", letterSpacing: "-0.01em" });
    const caret = h("span", {}, box);
    css(caret, { display: "inline-block", width: "7px", height: "66px", background: C.ink,
      marginLeft: "4px", borderRadius: "4px" });
    const ph = h("span", { text: cfg.placeholder || "" }, box);
    css(ph, { position: "absolute", left: "64px", color: "#9AA0A6", fontWeight: 600, whiteSpace: "pre" });
    const send = h("div", {}, box);
    css(send, { position: "absolute", right: "18px", top: "50%", width: "98px", height: "98px",
      marginTop: "-49px", borderRadius: "50%", background: C.yellow, border: `7px solid ${C.ink}`,
      boxSizing: "border-box", display: "flex", alignItems: "center", justifyContent: "center",
      willChange: "transform" });
    send.innerHTML = `<svg width="46" height="46" viewBox="0 0 46 46"><path d="M23 38 V9 M10 21 L23 8 L36 21"
      fill="none" stroke="${C.ink}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const ghost = h("div", {}, parent);   // the submitted text flying off
    css(ghost, { position: "absolute", left: (x + 64) + "px", top: (y + 40) + "px", fontFamily: G3M.FONT,
      fontWeight: 700, fontSize: "58px", color: C.ink, whiteSpace: "pre", opacity: 0, willChange: "transform" });

    // compiled state
    const states = [{ t: 0, text: "", typing: false }];
    let t = cfg.at ?? 0, text = "", submitAt = null;
    const push = (s, typing = true) => states.push({ t, text: s, typing });

    const api = {
      el: box,
      get end() { return t; },
      type(str, o = {}) {
        const sp = o.speed ?? speed;
        for (const ch of str) {
          let d = sp * (1 + (rnd() * 2 - 1) * jitter);
          if (ch === " ") d *= 1.35;              // a beat between words
          if (/[.,!?]/.test(ch)) d *= 2.2;
          t += d; text += ch; push(text);
        }
        return api;
      },
      pause(ms) { t += ms; push(text, false); return api; },
      delete(what, o = {}) {
        let n = typeof what === "number" ? what
              : (text.endsWith(what) ? what.length : Math.min(text.length, String(what).length));
        const sp = o.speed ?? speed * .45;
        if (typeof what === "string" && text.endsWith(" " + what)) n = what.length;
        while (n-- > 0) { t += sp; text = text.slice(0, -1); push(text); }
        return api;
      },
      replace(what, str) { return api.delete(what).pause(120).type(str); },
      // autocomplete: the rest of the word appears at once
      complete(str) { t += 90; text += str; push(text); return api; },
      submit(o = {}) { t += 120; submitAt = t; t += o.dur ?? 700; push("", false); return api; },

      render(now) {
        // find current state
        let st = states[0];
        for (const s of states) { if (s.t <= now) st = s; else break; }
        const submitted = submitAt != null && now >= submitAt;
        const shown = submitted ? "" : st.text;
        textEl.textContent = shown;
        ph.style.opacity = shown ? 0 : 1;
        // caret: solid while typing, blinking when idle
        const lastChange = st.t;
        const idle = now - lastChange > 140;
        caret.style.opacity = submitted ? 0 : (!idle ? 1 : (Math.floor((now - lastChange) / 530) % 2 ? 0 : 1));
        // submit: button presses, box squashes, text flies off
        if (submitAt != null) {
          const d = now - submitAt;
          const press = kf(d, [[0, 1], [70, .82, E.outQuad], [260, 1, E.pop]]);
          send.style.transform = `scale(${press})`;
          const sq = kf(d, [[0, 0], [90, .08, E.outQuad], [300, 0, E.bouncy]]);
          box.style.transform = `scale(${1 + sq * .4},${1 - sq})`;
          const fly = clamp(d / 520);
          ghost.textContent = d >= 0 ? (states.filter(s => s.t < submitAt).pop() || {}).text || "" : "";
          ghost.style.opacity = d >= 0 && d < 520 ? 1 - E.inQuad(fly) : 0;
          ghost.style.transform = `translate(${E.inCubic(fly) * 180}px,${-E.outCubic(fly) * 260}px) scale(${1 - fly * .35})`;
        } else {
          send.style.transform = "scale(1)"; box.style.transform = "none"; ghost.style.opacity = 0;
        }
      }
    };
    return api;
  };

})(window.G3M = window.G3M || {});

</script>
<script>/* motion/video.js */
/* Media compositing.
 *
 *   const m = G3M.Media(sceneEl, { src: "demo.mp4", treatment: "browser" });
 *   m.setMedia("other.mp4");
 *   m.camera({ zoom: 2.4, fx: .72, fy: .34, dim: .3 });   // per frame
 *
 * src can be "mock" (a built-in stand-in g3po app), an image or a video URL.
 * Video time is driven from the timeline (seek on render) so exports are exact.
 *
 * Treatments: fullscreen, browser, card, circle, tilted, pip, split-left,
 *             split-right
 */
(function (G3M) {
  "use strict";
  const { h, css, C, clamp } = G3M;

  const FRAMES = {
    fullscreen: { x: 0, y: 0, w: 1920, h: 1080, r: 0, chrome: false },
    browser:    { x: 210, y: 120, w: 1500, h: 860, r: 34, chrome: true },
    card:       { x: 260, y: 150, w: 1400, h: 790, r: 44, chrome: false },
    circle:     { x: 560, y: 140, w: 800, h: 800, r: 400, chrome: false },
    tilted:     { x: 260, y: 150, w: 1400, h: 790, r: 36, chrome: true, rot: -5 },
    pip:        { x: 1260, y: 640, w: 600, h: 360, r: 28, chrome: false },
    "split-left":  { x: 60, y: 150, w: 880, h: 780, r: 36, chrome: false },

      borderRadius: f.r + "px", overflow: "hidden", background: C.ink,
      border: f.r && !cfg.noBorder ? `8px solid ${C.ink}` : "none", boxSizing: "border-box",
      transformOrigin: "50% 50%", willChange: "transform" });

      css(bar, { position: "absolute", left: 0, top: 0, right: 0, height: chromeH + "px", background: "#2A2C2F",
        display: "flex", alignItems: "center", gap: "14px", paddingLeft: "26px", zIndex: 2 });

      }

      willChange: "transform, filter" });

      setMedia(src) { setMedia(src); return api; },
      /* Camera state, applied every frame:
       *   zoom, fx, fy  zoom factor and the focus point (0..1 of the view)
       *   panX, panY    extra offset in px
       *   rot           slight rotation of the whole frame
       *   blur, dim     0..1
       *   spot          {x, y, r} normalised spotlight, or null

<script>/* characters/g3.js */
/* G3 — the g3po mascot, as a pose-driven rig.
 *
 * Geometry comes from the original artwork (units scaled so the feet sit at
 * y = 0 and the antenna tip at about y = -300). Nothing here animates by
 * itself: callers compute a pose for time t and call set(pose). That keeps G3
 * deterministic and lets every scene direct him the same way.
 *
 * Pose keys (all optional):
 *   x, y, scale, rot, flip         placement
 *   lift                           hop height above the ground (shadow shrinks)
 *   squash                         +: flattened wide, -: stretched tall
 *   tilt                           head tilt in degrees
 *   lookX, lookY                   -1..1 where the eyes look
 *   blink                          0..1 eyelid closure
 *   eyes                           'round' | 'happy' | 'squint' | 'wide'
 *   mouth                          'none' | 'smile' | 'o'
 *   antenna                        wobble angle in degrees
 *   armL, armR                     arm angles in degrees (0 hangs down, 180 up)
 *   legL, legR                     leg swing in degrees

    const root = s("g", { class: "g3" }, parent);
    const shadow = s("ellipse", { cx: 0, cy: 2, rx: 92, ry: 13, fill: "rgba(28,29,31,.14)" }, root);
    const lifted = s("g", {}, root);
    const body = s("g", {}, lifted);               // squash group, origin at feet

    // legs
    const legL = s("g", {}, body), legR = s("g", {}, body);
    s("rect", { x: -40, y: -56, width: 32, height: 44, rx: 12, fill: LIMB, ...O }, legL);
    s("rect", { x: -52, y: -19, width: 50, height: 19, rx: 9.5, fill: FEET, ...O }, legL);
    s("rect", { x: 8, y: -56, width: 32, height: 44, rx: 12, fill: LIMB, ...O }, legR);
    s("rect", { x: 2, y: -19, width: 50, height: 19, rx: 9.5, fill: FEET, ...O }, legR);

    // arms sit behind the torso
    const armL = s("g", {}, body), armR = s("g", {}, body);
    s("rect", { x: -88, y: -114, width: 32, height: 60, rx: 16, fill: LIMB, ...O }, armL);
    s("rect", { x: 56, y: -114, width: 32, height: 60, rx: 16, fill: LIMB, ...O }, armR);

    // torso
    s("rect", { x: -12, y: -134, width: 24, height: 26, rx: 9, fill: LIMB, ...O }, body);
    s("rect", { x: -54, y: -120, width: 108, height: 76, rx: 24, fill: yellow, ...O }, body);
    s("rect", { x: -29, y: -95, width: 58, height: 35, rx: 8, fill: C.grey }, body);
    s("rect", { x: -21, y: -87, width: 17, height: 19, rx: 3.5, fill: C.blue }, body);
    s("rect", { x: 4, y: -87, width: 17, height: 19, rx: 3.5, fill: "#C0392B" }, body);

    const antenna = s("g", {}, head);

    const tip = s("circle", { cx: 0, cy: -294, r: 11, fill: C.red }, antenna);

    const phones = s("g", { opacity: 0 }, head);
    s("path", { d: "M-92,-190 Q0,-300 92,-190", fill: "none", stroke: "#4D5660", "stroke-width": 14, "stroke-linecap": "round" }, phones);

    s("rect", { x: -100, y: -258, width: 200, height: 136, rx: 66, fill: yellow, ...O }, head);
    const cheeks = s("g", { opacity: .85 }, head);
    s("circle", { cx: -70, cy: -160, r: 14, fill: C.cheek }, cheeks);
    s("circle", { cx: 70, cy: -160, r: 14, fill: C.cheek }, cheeks);

    const cupsL = s("rect", { x: -114, y: -212, width: 30, height: 52, rx: 13, fill: "#4D5660" }, phones);
    const cupsR = s("rect", { x: 84, y: -212, width: 30, height: 52, rx: 13, fill: "#4D5660" }, phones);
    s("rect", { x: -108, y: -202, width: 16, height: 32, rx: 7, fill: C.blue }, phones);

      s("circle", { cx: 9, cy: 9, r: 4, fill: "#C9CCD0" }, hl);
      round.push({ disc, hl }); lids.push(lid);
      s("path", { d: `M${ex - 17},${eyeY + 6} Q${ex},${eyeY - 16} ${ex + 17},${eyeY + 6}`,
        fill: "none", stroke: INK, "stroke-width": 10, "stroke-linecap": "round" }, eHappy);
      const dir = ex < 0 ? 1 : -1;
      s("path", { d: `M${ex - 14 * dir},${eyeY - 12} L${ex + 12 * dir},${eyeY} L${ex - 14 * dir},${eyeY + 12}`,
        fill: "none", stroke: INK, "stroke-width": 10, "stroke-linecap": "round", "stroke-linejoin": "round" }, eSquint);
      s("circle", { cx: ex, cy: eyeY, r: 33, fill: "#fff" }, eWide);
      s("circle", { cx: ex, cy: eyeY + 2, r: 16, fill: INK }, eWide);
      s("circle", { cx: ex - 5, cy: eyeY - 4, r: 5, fill: "#fff" }, eWide);
    }

      "stroke-width": 6, "stroke-linecap": "round", opacity: 0 }, head);
    const mouthO = s("ellipse", { cx: 0, cy: -148, rx: 8, ry: 10, fill: INK, opacity: 0 }, head);

    let lastEyes = null;
    function setEyes(mode) {
      if (mode === lastEyes) return;
      lastEyes = mode;
      eRound.setAttribute("opacity", mode === "round" ? 1 : 0);
      eHappy.setAttribute("opacity", mode === "happy" ? 1 : 0);
      eSquint.setAttribute("opacity", mode === "squint" ? 1 : 0);
      eWide.setAttribute("opacity", mode === "wide" ? 1 : 0);

    const api = {
      el: root,
      set(p = {}) {
        const sc = p.scale ?? 1, flip = p.flip ? -1 : 1;
        set(root, { transform: `translate(${p.x ?? 0},${p.y ?? 0}) rotate(${p.rot ?? 0}) scale(${sc * flip},${sc})`,
          opacity: p.opacity ?? 1 });
        const lift = p.lift ?? 0;

        const sh = Math.max(.35, 1 - lift / 420);
        set(shadow, { rx: 92 * sh, opacity: sh, visibility: p.shadow === false ? "hidden" : "visible" });

        set(head, { transform: `rotate(${p.tilt ?? 0} 0 -126)` });
        set(antenna, { transform: `rotate(${p.antenna ?? 0} 0 -258)` });
        set(armL, { transform: `rotate(${p.armL ?? 0} -72 -104)` });
        set(armR, { transform: `rotate(${-(p.armR ?? 0)} 72 -104)` });
        set(legL, { transform: `rotate(${p.legL ?? 0} -24 -50)` });
        set(legR, { transform: `rotate(${p.legR ?? 0} 24 -50)` });
        const lx = (p.lookX ?? 0) * 8, ly = (p.lookY ?? 0) * 6;
        for (const r of round) {
          set(r.disc, { transform: `translate(${lx},${ly})` });
          set(r.hl, { transform: `translate(${lx * .35},${ly * .35})` });
        }
        const b = Math.max(0, Math.min(1, p.blink ?? 0));
        for (const lid of lids) {
          const ex = lid === lids[0] ? eyeX[0] : eyeX[1];
          set(lid, { transform: `translate(${ex},${eyeY}) scale(1,${Math.max(.06, 1 - b)})` });
        }
        setEyes(p.eyes || "round");
        set(mouthSmile, { opacity: p.mouth === "smile" ? 1 : 0 });
        set(mouthO, { opacity: p.mouth === "o" ? 1 : 0 });
        set(phones, { opacity: p.headphones ? 1 : 0 });
        set(tip, { opacity: p.tipOff ? .35 : 1 });

      }
    };
    api.set(opts.pose || {});
    return api;
  };

   * for time t so scenes can mix them into their own keyframes. */

<script>/* transitions/shapes.js */
/* Transitions, part 1: shape-driven.
 *
 * A transition is  (ctx, cfg) -> { duration, render(p) }  with p in 0..1.
 * ctx: { stage, from, to, mid, fx }
 *   from, to  the outgoing and incoming scene elements (both visible here)
 *   mid       a layer between them: above `from`, below `to`
 *   fx        a layer above everything
 * The director resets styles when the transition is not active, so render()
 * only has to describe the moment. Most transitions cover the screen at their
 * midpoint, which is where the cut happens.
 */
(function (G3M) {
  "use strict";
  const { s, set, css, C, kf, ease: E, clamp } = G3M;
  G3M.transitions = G3M.transitions || {};
  const T = G3M.transitions;

  const W = 1920, H = 1080, DIAG = Math.hypot(W, H);
  const radiusToCover = (x, y) =>
    Math.max(Math.hypot(x, y), Math.hypot(W - x, y), Math.hypot(x, H - y), Math.hypot(W - x, H - y)) + 20;
  G3M.coverRadius = radiusToCover;

  function svgIn(layer) { return G3M.svgLayer(layer, W, H); }

  // 01: a dot pops, then balloons past the edges; the next scene grows out of it
  T.circleExplosion = function (ctx, cfg = {}) {
    const x = cfg.x ?? W / 2, y = cfg.y ?? H / 2, R = radiusToCover(x, y);
    const col = G3M.color(cfg.color || "yellow");
    const svg = svgIn(ctx.mid);
    const disc = s("circle", { cx: x, cy: y, r: 0, fill: col }, svg);
    const ringSvg = svgIn(ctx.fx);
    const ring = s("circle", { cx: x, cy: y, r: 0, fill: "none", stroke: C.ink, "stroke-width": 16 }, ringSvg);
    return {
      duration: cfg.duration ?? 900,
      render(p) {
        const r = kf(p, [[0, 0], [.1, 70, E.pop], [.2, 56, E.outQuad], [.5, R, E.inExpo]]);
        set(disc, { r });
        const q = clamp((p - .48) / .52);
        const rr = E.outExpo(q) * R;
        ctx.to.style.clipPath = `circle(${rr}px at ${x}px ${y}px)`;
        set(ring, { r: rr, opacity: q > 0 && q < .98 ? 1 - q * .6 : 0, "stroke-width": 18 * (1 - q) + 4 });
      }
    };
  };

  // 02: the frame closes to a pinpoint, holds a beat, then opens on the next scene
  T.blackIris = function (ctx, cfg = {}) {
    const x = cfg.x ?? W / 2, y = cfg.y ?? H / 2, R = radiusToCover(x, y);
    const bg = svgIn(ctx.mid);
    const sheet = s("path", { fill: G3M.color(cfg.color || "ink"), "fill-rule": "evenodd" }, bg);
    const hole = r => r <= 0 ? `M0,0 H${W} V${H} H0 Z`
      : `M0,0 H${W} V${H} H0 Z M${x - r},${y} a${r},${r} 0 1,0 ${2 * r},0 a${r},${r} 0 1,0 ${-2 * r},0 Z`;
    const dotSvg = svgIn(ctx.fx);
    const dot = s("circle", { cx: x, cy: y, r: 0, fill: C.yellow }, dotSvg);
    return {
      duration: cfg.duration ?? 1000,
      render(p) {
        const rOut = kf(p, [[0, R], [.34, 150, E.outQuint], [.44, 0, E.inBack(2.2)]]);
        sheet.setAttribute("d", hole(Math.max(0, rOut)));
        set(dot, { r: kf(p, [[.4, 0], [.5, 26, E.pop], [.6, 18], [.64, 0, E.inQuad]]) });
        const q = clamp((p - .6) / .4);
        ctx.to.style.clipPath = `circle(${E.outExpo(q) * R}px at ${x}px ${y}px)`;
      }
    };
  };

  // 04: alternating yellow and black panels slam down, then drop away
  T.verticalPanels = function (ctx, cfg = {}) {
    const n = cfg.panels ?? 6, w = W / n;
    const svg = svgIn(ctx.fx);
    const cols = [G3M.color(cfg.color || "yellow"), G3M.color(cfg.color2 || "ink")];
    const rects = [];
    for (let i = 0; i < n; i++)
      rects.push(s("rect", { x: i * w - 1, y: -H, width: w + 2, height: H, fill: cols[i % 2] }, svg));
    return {
      duration: cfg.duration ?? 950,
      render(p) {
        rects.forEach((r, i) => {
          const d = i * .045;
          const inP = clamp((p - d) / .3), outP = clamp((p - .56 - d) / .3);
          const y = -H * (1 - E.outQuint(inP)) + H * E.inCubic(outP);
          const sq = inP >= 1 && outP <= 0 ? kf(p - d - .3, [[0, 14], [.08, 0, E.outQuad]]) : 0;
          set(r, { y: y - sq, height: H + sq });
        });
        ctx.to.style.visibility = p >= .5 ? "visible" : "hidden";
      }
    };
  };

  // 16: the scene flattens into a line, the line flashes, the next scene springs open
  T.squash = function (ctx, cfg = {}) {
    const svg = svgIn(ctx.fx);
    const line = s("rect", { x: 0, y: H / 2 - 7, width: W, height: 14, fill: C.ink, opacity: 0 }, svg);
    return {
      duration: cfg.duration ?? 850,
      render(p) {
        const a = E.inBack(1.8)(clamp(p / .4));
        ctx.from.style.transformOrigin = "50% 50%";
        ctx.from.style.transform = `scale(${1 + a * .12},${Math.max(.004, 1 - a)})`;
        ctx.from.style.visibility = p < .42 ? "visible" : "hidden";
        const lineOn = p >= .38 && p < .62;
        const lw = kf(p, [[.38, 1], [.46, 1.06, E.outQuad], [.56, .2, E.inCubic]]);
        set(line, { opacity: lineOn ? 1 : 0, fill: p < .47 ? C.ink : C.yellow,
          x: W / 2 - W * lw / 2, width: W * lw });
        const b = clamp((p - .54) / .46);
        const sy = b <= 0 ? 0 : kf(b, [[0, .01], [.55, 1.08, E.outCubic], [.8, .97], [1, 1, E.outQuad]]);
        ctx.to.style.transformOrigin = "50% 50%";
        ctx.to.style.transform = `scale(${1 - (1 - Math.min(1, sy)) * .1},${Math.max(.004, sy)})`;
        ctx.to.style.visibility = p >= .54 ? "visible" : "hidden";
      }
    };
  };

})(window.G3M = window.G3M || {});

</script>
<script>/* transitions/sweeps.js */
/* Transitions, part 2: sweeps. Something crosses the frame; the next scene is
 * revealed along its trailing edge, so the cut is continuous rather than a
 * cover-and-swap. */
(function (G3M) {
  "use strict";
  const { s, set, C, kf, ease: E, clamp } = G3M;
  const T = G3M.transitions;
  const W = 1920, H = 1080;

  const poly = pts => "polygon(" + pts.map(p => `${p[0].toFixed(1)}px ${p[1].toFixed(1)}px`).join(",") + ")";
  const pathOf = pts => "M" + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L") + " Z";

  // 03: a slanted yellow slab slashes across, black blade leading
  T.diagonalSlash = function (ctx, cfg = {}) {
    const slant = cfg.slant ?? .42, band = cfg.band ?? 620, dir = cfg.direction === "left" ? -1 : 1;
    const svg = G3M.svgLayer(ctx.fx, W, H);
    const slab = s("path", { fill: G3M.color(cfg.color || "yellow") }, svg);
    const blade = s("path", { fill: C.ink }, svg);
    const off = slant * H / 2;
    const edge = (e, dy) => e + slant * dy;          // x of a slanted line at vertical offset dy
    const mirror = pts => dir > 0 ? pts : pts.map(([x, y]) => [W - x, y]);
    return {
      duration: cfg.duration ?? 720,
      render(p) {
        const e = kf(p, [[0, -band - off - 160], [1, W + off + 260, E.whip]]);   // trailing edge
        const trail = (dy) => edge(e, dy);
        const lead = (dy) => edge(e + band, dy);
        slab.setAttribute("d", pathOf(mirror([[trail(-H / 2), 0], [lead(-H / 2), 0], [lead(H / 2), H], [trail(H / 2), H]])));
        const b0 = e + band + 34, b1 = b0 + 46;
        blade.setAttribute("d", pathOf(mirror([[edge(b0, -H / 2), 0], [edge(b1, -H / 2), 0], [edge(b1, H / 2), H], [edge(b0, H / 2), H]])));
        ctx.to.style.clipPath = poly(mirror([[-400, 0], [trail(-H / 2) + 1, 0], [trail(H / 2) + 1, H], [-400, H]]));
      }
    };
  };

  // 05: a thick rounded band wipes across
  T.wipe = function (ctx, cfg = {}) {
    const band = cfg.band ?? 700;
    const svg = G3M.svgLayer(ctx.fx, W, H);
    const pill = s("rect", { y: -60, height: H + 120, rx: (H + 120) / 2, width: band + H, fill: G3M.color(cfg.color || "yellow") }, svg);
    const trailCap = s("rect", { y: -60, height: H + 120, width: 0, fill: G3M.color(cfg.color || "yellow") }, svg);
    return {
      duration: cfg.duration ?? 700,
      render(p) {
        const e = kf(p, [[0, -band - H], [1, W + 60, E.whip]]);     // trailing x
        set(pill, { x: e });
        set(trailCap, { x: e, width: H / 2 });                        // flat trailing edge
        ctx.to.style.clipPath = `inset(0 ${Math.max(0, W - e - 1)}px 0 0)`;
      }
    };
  };

  // 12: a yellow wave rolls across; its trailing crest reveals the next scene
  T.wave = function (ctx, cfg = {}) {
    const band = cfg.band ?? 520, amp = cfg.amplitude ?? 70, wl = cfg.wavelength ?? 540;
    const svg = G3M.svgLayer(ctx.fx, W, H);
    const body = s("path", { fill: G3M.color(cfg.color || "yellow") }, svg);
    const crest = s("path", { fill: "none", stroke: C.ink, "stroke-width": 16, "stroke-linecap": "round" }, svg);
    const N = 36;
    const xs = (base, phase) => {
      const out = [];
      for (let i = 0; i <= N; i++) {
        const y = -40 + (H + 80) * i / N;
        out.push([base + Math.sin(y / wl * Math.PI * 2 + phase) * amp, y]);
      }
      return out;
    };
    return {
      duration: cfg.duration ?? 950,
      render(p) {
        const e = kf(p, [[0, -band - amp * 3], [1, W + amp * 3, E.inOutCubic]]);

        crest.setAttribute("opacity", p < .96 ? 1 : 0);
        ctx.to.style.clipPath = "polygon(" +
          ["-50px -50px", ...trail.map(q => `${(q[0] + 1).toFixed(1)}px ${q[1].toFixed(1)}px`), "-50px 1150px"].join(",") + ")";
      }
    };
  };

})(window.G3M = window.G3M || {});

/* Transitions, part 3: someone does the transition. */

  "use strict";
  const { s, set, C, kf, ease: E, clamp } = G3M;

    const svg = G3M.svgLayer(ctx.fx, W, H);

      duration: dur,

        const t = p * dur;

        set(edge, { x: x - sheet - 138 });
        ctx.to.style.clipPath = `inset(0 ${Math.max(0, W - (x - sheet - 128))}px 0 0)`;
        g3.set({ x, y: ground, scale: sc, rot: 9, ...st, armL: 150 + st.armL * .3, armR: 150 - st.armL * .3,
          eyes: "squint", tilt: -4, antenna: -18 + Math.sin(t / 45) * 6 });

        for (let i = 0; i < 4; i++) {
          const yy = ground - 110 - i * 70, len = 90 + (i % 2) * 60;

            "stroke-linecap": "round", opacity: .8 }, lines);

  };

  /* 07: G3 hauls the next scene in by its edge, struggles, stops, glances at
   * the camera, and then the panel whips shut and drags him off. */
  T.g3Push = function (ctx, cfg = {}) {
    const ground = cfg.ground ?? 1000, sc = cfg.scale ?? 1.6;
    const svg = G3M.svgLayer(ctx.fx, W, H);
    const g3 = G3M.G3(svg);
    const dur = cfg.duration ?? 1700;
    return {
      duration: dur,
      render(p) {
        const t = p * dur;
        // panel's left edge
        const x = kf(t, [[0, W + 40], [220, 1500, E.outCubic], [900, 1120, E.inOutQuad],
                         [1180, 1110], [1420, -60, E.inExpo], [1580, 30, E.outQuad], [1700, 0, E.outQuad]]);

        const st = struggling ? G3M.g3Life.stride(t, .9) : {};
        const gx = x - 95 + (flung ? -kf(t, [[1180, 0], [1420, 260, E.inQuad]]) : 0);
        g3.set({
          x: gx, y: ground - (flung ? kf(t, [[1180, 0], [1420, 120, E.outQuad]]) : 0), scale: sc, flip: true,
          rot: struggling ? -12 : flung ? kf(t, [[1180, 0], [1420, -60, E.inQuad]]) : 0,
          ...st, armL: struggling ? 95 : flung ? 160 : 70, armR: struggling ? 95 : 60,
          eyes: struggling ? "squint" : flung ? "wide" : "round",
          lookX: looking ? 0 : -1, lookY: looking ? .4 : 0,
          blink: looking ? G3M.g3Life.blink(t, 1020) : 0,
          squash: struggling ? .06 + Math.sin(t / 60) * .02 : 0,
          antenna: flung ? G3M.g3Life.twang(t, 1180, 30) : Math.sin(t / 70) * 6,

    const top = G3M.svgLayer(ctx.fx, W, H);

<script>/* scenes/typography.js */
/* Scene templates led by typography.
 * A scene is (el, cfg, stage) -> { duration, render(t) }, where el is a
 * full-frame container the scene owns. All copy comes from cfg. */
(function (G3M) {
  "use strict";
  const { h, css, s, set, C, kf, ease: E, clamp } = G3M;

    el.style.background = G3M.color(cfg.background || "yellow");
    const svgLayer = layer(el, 1), textLayer = layer(el, 2);
    const bt = G3M.BigText(textLayer, { text: lines(cfg.title || "MEET G3PO"), width: cfg.width ?? .62,
      align: "left", color: cfg.foreground || "ink", stretch: cfg.stretch ?? 78 });
    bt.el.style.paddingLeft = "110px";
    const svg = G3M.svgLayer(svgLayer, 1920, 1080);
    const g3 = G3M.mascot(cfg.mascot || "g3", svg);

        background: C.ink, color: C.white, padding: "18px 34px", borderRadius: "40px", fontFamily: G3M.FONT });

      duration: cfg.duration ?? 2600,

          exit: cfg.exit, exitAt: cfg.exitAt });
        // hop in from the right, land, look at the title, point
        const air = clamp((t - 300) / 420);
        const x = kf(t, [[300, 2150], [720, X, E.outCubic]]);
        const lift = air > 0 && air < 1 ? Math.sin(air * Math.PI) * 170 : 0;
        const land = t - 720;

                                 : (t > 250 && t < 300 ? .12 : air > 0 ? -.06 : 0);
        const life = G3M.g3Life.idle(t, 1);
        g3.set({ x, y: Y, scale: sc, lift, squash: squash + (land > 400 ? life.squash : 0),
          lookX: t > 900 ? -1 : 0, lookY: t > 900 ? -.2 : 0,
          blink: Math.max(G3M.g3Life.blink(t, 1250), land > 1600 ? life.blink : 0),
          armL: kf(t, [[1350, 0], [1560, 118, E.pop]]), armR: kf(t, [[1350, 0], [1560, 20, E.pop]]),
          antenna: G3M.g3Life.twang(t, 720, 18) + life.antenna, flip: false,
          eyes: t > 1900 ? "happy" : "round" });

          G3M.applyTransform(sub, f);

  S.slam = function (el, cfg) {

    const shakeWrap = layer(el, 1);
    const svg = G3M.svgLayer(layer(shakeWrap, 1), 1920, 1080);
    const textLayer = layer(shakeWrap, 2);
    const ls = lines(cfg.text || "PARALLEL.");
    const bt = G3M.BigText(textLayer, { text: ls, width: cfg.width ?? .94, color: cfg.foreground || "ink",
      stretch: cfg.stretch ?? 70, leading: .8 });
    const withG3 = cfg.g3 !== false;

    if (withG3) bt.el.style.transform = `translateY(${cfg.textOffset ?? (835 - 540 - blockH / 2)}px)`;
    const g3 = withG3 ? G3M.G3(svg) : null;

      render(t) {

          exitAt: cfg.exitAt ?? (cfg.exit ? (cfg.duration ?? 2400) - 450 : Infinity) });
